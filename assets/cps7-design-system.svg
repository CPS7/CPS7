<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 44" width="100%" height="100%">
  <style>
    .font-mono {
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, monospace;
    }
  </style>
  <g transform="translate(40, 26)">
    <!-- Legend Label -->
    <text x="0" y="0" fill="#64748B" class="font-mono" font-size="9" font-weight="700" letter-spacing="1.5">SEMANTIC CHROMATICS:</text>

    <!-- Gold: Execution -->
    <circle cx="180" cy="-3.5" r="4" fill="#F5CD79"/>
    <text x="190" y="0" fill="#CBD5E1" class="font-mono" font-size="10">EXECUTION</text>

    <!-- Blue: Systems -->
    <circle cx="310" cy="-3.5" r="4" fill="#38BDF8"/>
    <text x="320" y="0" fill="#CBD5E1" class="font-mono" font-size="10">SYSTEMS</text>

    <!-- Green: Live Production -->
    <circle cx="430" cy="-3.5" r="4" fill="#34D399"/>
    <text x="440" y="0" fill="#CBD5E1" class="font-mono" font-size="10">LIVE PRODUCTION</text>

    <!-- Purple: AI / Algorithms -->
    <circle cx="590" cy="-3.5" r="4" fill="#A78BFA"/>
    <text x="600" y="0" fill="#CBD5E1" class="font-mono" font-size="10">AI &amp; INTELLIGENCE</text>
  </g>
</svg>
