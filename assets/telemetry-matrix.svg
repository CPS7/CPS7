<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <filter id="telemetryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-gh { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  </style>

  <!-- Outer Card Frame (GitHub Dark #0D1117 & #30363D) -->
  <rect x="0.5" y="0.5" width="899" height="159" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Top Bar -->
  <path d="M 0.5,6.5 Q 0.5,0.5 6.5,0.5 L 893.5,0.5 Q 899.5,0.5 899.5,6.5 L 899.5,36 L 0.5,36 Z" fill="#161B22"/>
  <line x1="0.5" y1="36" x2="899.5" y2="36" stroke="#30363D" stroke-width="1"/>

  <!-- Top Header Title -->
  <g transform="translate(450, 22)">
    <text x="0" y="0" text-anchor="middle" fill="#8B949E" class="font-mono" font-size="11" font-weight="600" letter-spacing="1">
      ENGINEERING TELEMETRY &amp; VELOCITY METRICS
    </text>
  </g>

  <!-- 4 Metric Pillars (Symmetrically Centered) -->
  <g transform="translate(45, 52)">
    <!-- Metric 1: Shipped Modules -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="185" height="85" rx="6" fill="#161B22" stroke="#30363D"/>
      <text x="18" y="24" fill="#8B949E" class="font-mono" font-size="10">SHIPPED CODEBASES</text>
      <text x="18" y="54" fill="#F0F6FC" class="font-gh" font-size="24" font-weight="800">20+</text>
      <text x="75" y="52" fill="#3FB950" class="font-mono" font-size="11">Production</text>
      <line x1="18" y1="68" x2="167" y2="68" stroke="#238636" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Metric 2: Primary Architecture -->
    <g transform="translate(208, 0)">
      <rect x="0" y="0" width="185" height="85" rx="6" fill="#161B22" stroke="#30363D"/>
      <text x="18" y="24" fill="#8B949E" class="font-mono" font-size="10">CORE STACK</text>
      <text x="18" y="52" fill="#58A6FF" class="font-mono" font-size="15" font-weight="700">TypeScript / C++</text>
      <text x="18" y="70" fill="#8B949E" class="font-mono" font-size="10">Python • Go • SQL</text>
    </g>

    <!-- Metric 3: System Focus -->
    <g transform="translate(416, 0)">
      <rect x="0" y="0" width="185" height="85" rx="6" fill="#161B22" stroke="#30363D"/>
      <text x="18" y="24" fill="#8B949E" class="font-mono" font-size="10">SYSTEM DOMAIN</text>
      <text x="18" y="52" fill="#3FB950" class="font-mono" font-size="15" font-weight="700">Distributed &amp; CLI</text>
      <text x="18" y="70" fill="#8B949E" class="font-mono" font-size="10">Real-time Pipelines</text>
    </g>

    <!-- Metric 4: Code Quality -->
    <g transform="translate(624, 0)">
      <rect x="0" y="0" width="185" height="85" rx="6" fill="#161B22" stroke="#30363D"/>
      <text x="18" y="24" fill="#8B949E" class="font-mono" font-size="10">BUILD STATUS</text>
      <text x="18" y="52" fill="#A371F7" class="font-mono" font-size="15" font-weight="700">Main Passing</text>
      <text x="18" y="70" fill="#3FB950" class="font-mono" font-size="10">● Continuous Delivery</text>
    </g>
  </g>
</svg>
