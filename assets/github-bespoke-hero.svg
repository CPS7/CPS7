<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="100%">
  <defs>
    <!-- GitHub Pure Canvas Gradient -->
    <linearGradient id="ghMatteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <!-- GitHub Emerald & Gold Accents -->
    <linearGradient id="ghGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3FB950"/>
      <stop offset="100%" stop-color="#2EA043"/>
    </linearGradient>

    <linearGradient id="ghStarGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2CC60"/>
      <stop offset="100%" stop-color="#D29922"/>
    </linearGradient>

    <linearGradient id="ghBorderHairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363D"/>
      <stop offset="40%" stop-color="#58A6FF" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#3FB950" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#30363D"/>
    </linearGradient>

    <!-- Soft Dopamine Glow -->
    <filter id="calmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>
    
    <filter id="subtleBeacon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-gh {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    }

    @keyframes calmPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes sweepGlint {
      0% { transform: translateX(-880px); }
      100% { transform: translateX(880px); }
    }

    .pulse-dot {
      animation: calmPulse 3s ease-in-out infinite;
      transform-origin: center;
    }
    .glint-top {
      animation: sweepGlint 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Card Canvas -->
  <rect x="1" y="1" width="878" height="248" rx="12" fill="url(#ghMatteBg)" stroke="#30363D" stroke-width="1.2"/>

  <!-- Subtle Atmospheric Emerald Glow behind Avatar -->
  <circle cx="90" cy="110" r="70" fill="#2EA043" opacity="0.08" filter="url(#calmGlow)"/>
  <circle cx="780" cy="80" r="80" fill="#58A6FF" opacity="0.05" filter="url(#calmGlow)"/>

  <!-- Top Hairline Precision Light Sweep -->
  <g clip-path="url(#cardClip)">
    <line class="glint-top" x1="0" y1="1" x2="880" y2="1" stroke="url(#ghBorderHairline)" stroke-width="2"/>
  </g>

  <!-- LEFT: BESPOKE GITHUB OCTO-ARCHITECT BADGE -->
  <g transform="translate(42, 45)">
    <!-- Outer Shield Frame -->
    <rect x="0" y="0" width="86" height="86" rx="20" fill="#21262D" stroke="#30363D" stroke-width="1.5"/>
    <rect x="4" y="4" width="78" height="78" rx="16" fill="#0D1117"/>
    
    <!-- Iconic Monogram -->
    <text x="43" y="47" text-anchor="middle" fill="#F0F6FC" class="font-gh" font-size="24" font-weight="900" letter-spacing="-0.5">CPS</text>
    <text x="43" y="66" text-anchor="middle" fill="#3FB950" class="font-mono" font-size="14" font-weight="800">7</text>
    
    <!-- Verified Green Live Ping -->
    <circle class="pulse-dot" cx="74" cy="74" r="6" fill="#3FB950" filter="url(#subtleBeacon)"/>
    <circle cx="74" cy="74" r="3" fill="#FFFFFF"/>
  </g>

  <!-- CENTER: MASTER TYPOGRAPHY & IDENTITY -->
  <g transform="translate(148, 52)">
    <!-- GitHub Special Edition Kicker -->
    <g>
      <rect x="0" y="0" width="180" height="22" rx="6" fill="#1F242C" stroke="#30363D" stroke-width="1"/>
      <circle cx="11" cy="11" r="3" fill="#3FB950"/>
      <text x="22" y="15" fill="#C9D1D9" class="font-mono" font-size="9.5" font-weight="600" letter-spacing="1">GITHUB VERIFIED ARCHITECT</text>
    </g>

    <!-- Main Name -->
    <text x="0" y="56" fill="#F0F6FC" class="font-gh" font-size="34" font-weight="800" letter-spacing="-0.5">Lakshay Rastogi</text>

    <!-- Role Subtitle -->
    <text x="0" y="80" fill="#8B949E" class="font-gh" font-size="14" font-weight="400">
      Staff-Grade Full-Stack Engineer &amp; Systems Architect • <tspan fill="#58A6FF" font-weight="600">@CPS7</tspan>
    </text>
  </g>

  <!-- RIGHT: BESPOKE MINI HEATMAP WAVE (CALMING AESTHETIC REWARD) -->
  <g transform="translate(620, 52)">
    <rect x="0" y="0" width="218" height="82" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
    
    <!-- Heatmap Title -->
    <text x="14" y="20" fill="#8B949E" class="font-mono" font-size="9" font-weight="600">CONTRIBUTION DENSITY</text>
    <text x="14" y="38" fill="#F0F6FC" class="font-mono" font-size="14" font-weight="800">100% Deterministic</text>

    <!-- Micro Heatmap Blocks (Pure Visual Dopamine) -->
    <g transform="translate(14, 48)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="8" height="8" rx="2" fill="#0E4429"/>
      <rect x="11" y="0" width="8" height="8" rx="2" fill="#006D32"/>
      <rect x="22" y="0" width="8" height="8" rx="2" fill="#26A641"/>
      <rect x="33" y="0" width="8" height="8" rx="2" fill="#39D353"/>
      <rect x="44" y="0" width="8" height="8" rx="2" fill="#26A641"/>
      <rect x="55" y="0" width="8" height="8" rx="2" fill="#39D353"/>
      <rect x="66" y="0" width="8" height="8" rx="2" fill="#006D32"/>
      <rect x="77" y="0" width="8" height="8" rx="2" fill="#26A641"/>
      <rect x="88" y="0" width="8" height="8" rx="2" fill="#39D353"/>
      <rect x="99" y="0" width="8" height="8" rx="2" fill="#39D353"/>
      <rect x="110" y="0" width="8" height="8" rx="2" fill="#26A641"/>
      <rect x="121" y="0" width="8" height="8" rx="2" fill="#006D32"/>
      <rect x="132" y="0" width="8" height="8" rx="2" fill="#26A641"/>
      <rect x="143" y="0" width="8" height="8" rx="2" fill="#39D353"/>
      <rect x="154" y="0" width="8" height="8" rx="2" fill="#39D353"/>
      <rect x="165" y="0" width="8" height="8" rx="2" fill="#26A641"/>
      <rect x="176" y="0" width="8" height="8" rx="2" fill="#006D32"/>

      <!-- Row 2 -->
      <rect x="0" y="11" width="8" height="8" rx="2" fill="#006D32"/>
      <rect x="11" y="11" width="8" height="8" rx="2" fill="#26A641"/>
      <rect x="22" y="11" width="8" height="8" rx="2" fill="#39D353"/>
      <rect x="33" y="11" width="8" height="8" rx="2" fill="#39D353"/>
      <rect x="44" y="11" width="8" height="8" rx="2" fill="#006D32"/>
      <rect x="55" y="11" width="8" height="8" rx="2" fill="#26A641"/>
      <rect x="66" y="11" width="8" height="8" rx="2" fill="#39D353"/>
      <rect x="77" y="11" width="8" height="8" rx="2" fill="#39D353"/>
      <rect x="88" y="11" width="8" height="8" rx="2" fill="#26A641"/>
      <rect x="99" y="11" width="8" height="8" rx="2" fill="#006D32"/>
      <rect x="110" y="11" width="8" height="8" rx="2" fill="#26A641"/>
      <rect x="121" y="11" width="8" height="8" rx="2" fill="#39D353"/>
      <rect x="132" y="11" width="8" height="8" rx="2" fill="#39D353"/>
      <rect x="143" y="11" width="8" height="8" rx="2" fill="#26A641"/>
      <rect x="154" y="11" width="8" height="8" rx="2" fill="#39D353"/>
      <rect x="165" y="11" width="8" height="8" rx="2" fill="#39D353"/>
      <rect x="176" y="11" width="8" height="8" rx="2" fill="#39D353"/>
    </g>
  </g>

  <!-- LOWER REPUTATION BAR -->
  <line x1="42" y1="168" x2="838" y2="168" stroke="#30363D" stroke-width="1"/>

  <g transform="translate(42, 196)">
    <!-- Metric 1: Architecture -->
    <g>
      <text x="0" y="0" fill="#8B949E" class="font-mono" font-size="10">FOCUS</text>
      <text x="50" y="0" fill="#F0F6FC" class="font-gh" font-size="13" font-weight="600">Distributed Systems &amp; Low Latency</text>
    </g>

    <!-- Metric 2: Stack -->
    <g transform="translate(360, 0)">
      <text x="0" y="0" fill="#8B949E" class="font-mono" font-size="10">CORE</text>
      <text x="44" y="0" fill="#58A6FF" class="font-mono" font-size="12" font-weight="600">TypeScript • Next.js • C++ • Python</text>
    </g>

    <!-- Metric 3: Availability -->
    <g transform="translate(680, 0)">
      <circle cx="0" cy="-3.5" r="3.5" fill="#3FB950"/>
      <text x="12" y="0" fill="#3FB950" class="font-mono" font-size="11" font-weight="700">AVAILABLE TO SHIP</text>
    </g>
  </g>
</svg>
