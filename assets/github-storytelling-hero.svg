<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="100%">
  <defs>
    <!-- GitHub Native Dark Palette -->
    <linearGradient id="ghCanvas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#090C10"/>
    </linearGradient>

    <!-- Branch Colors (GitHub Native Aesthetics) -->
    <linearGradient id="mainBranch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#79C0FF"/>
    </linearGradient>

    <linearGradient id="systemsBranch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3FB950"/>
      <stop offset="100%" stop-color="#56D364"/>
    </linearGradient>

    <linearGradient id="aiBranch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BC8CFF"/>
      <stop offset="100%" stop-color="#D2A8FF"/>
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2CC60"/>
      <stop offset="100%" stop-color="#E3B341"/>
    </linearGradient>

    <linearGradient id="ghBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363D"/>
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#30363D"/>
    </linearGradient>

    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.2); opacity: 1; }
    }
    @keyframes commitDash {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    .active-commit {
      animation: pulseNode 2.5s ease-in-out infinite;
      transform-origin: center;
    }
    .branch-trace {
      stroke-dasharray: 6 6;
      animation: commitDash 3s linear infinite;
    }
  </style>

  <!-- GitHub Card Outer Frame -->
  <rect x="1" y="1" width="898" height="308" rx="12" fill="url(#ghCanvas)" stroke="url(#ghBorder)" stroke-width="1.2"/>

  <!-- TOP HEADER / REPO STATUS -->
  <g transform="translate(36, 32)">
    <!-- GitHub Commit Path Label -->
    <text x="0" y="0" fill="#8B949E" class="font-mono" font-size="11">
      <tspan fill="#58A6FF" font-weight="600">github.com/CPS7</tspan> / <tspan fill="#F0F6FC" font-weight="600">README.md</tspan>
    </text>

    <!-- Branch Pill -->
    <g transform="translate(240, -12)">
      <rect x="0" y="0" width="105" height="22" rx="11" fill="#21262D" stroke="#30363D"/>
      <!-- Branch Icon -->
      <path d="M 12,6 C 12,5 11,4 10,4 C 9,4 8,5 8,6 C 8,6.7 8.4,7.3 9,7.6 L 9,14.4 C 8.4,14.7 8,15.3 8,16 C 8,17 9,18 10,18 C 11,18 12,17 12,16 C 12,15.3 11.6,14.7 11,14.4 L 11,11 C 11,9.5 12,8.5 13.5,8.5 L 14,8.5 C 14.3,9.1 14.9,9.5 15.5,9.5 C 16.5,9.5 17.5,8.5 17.5,7.5 C 17.5,6.5 16.5,5.5 15.5,5.5 C 14.9,5.5 14.3,5.9 14,6.5 L 13.5,6.5 C 12.5,6.5 11.8,7.1 11.4,8 L 11,8 L 11,7.6 C 11.6,7.3 12,6.7 12,6 Z" fill="#8B949E"/>
      <text x="24" y="15" fill="#C9D1D9" class="font-mono" font-size="10" font-weight="600">main branch</text>
    </g>

    <!-- Live Release Tag on Right -->
    <g transform="translate(680, -12)">
      <rect x="0" y="0" width="148" height="22" rx="11" fill="#1F242C" stroke="#238636" stroke-opacity="0.6"/>
      <circle cx="12" cy="11" r="3.5" fill="#3FB950"/>
      <text x="24" y="15" fill="#3FB950" class="font-mono" font-size="10" font-weight="600">BUILD: SHIP READY</text>
    </g>
  </g>

  <!-- CENTER: STORYTELLING HERO IDENTITY -->
  <g transform="translate(36, 75)">
    <!-- Avatar / Octo-Profile Badge -->
    <g>
      <rect x="0" y="0" width="80" height="80" rx="40" fill="#21262D" stroke="#30363D" stroke-width="1.5"/>
      <text x="40" y="47" text-anchor="middle" fill="#F0F6FC" class="font-sans" font-size="24" font-weight="800">C7</text>
      <circle cx="64" cy="64" r="7" fill="#238636" stroke="#0D1117" stroke-width="2"/>
    </g>

    <!-- Developer Name & Story Header -->
    <g transform="translate(100, 14)">
      <text x="0" y="24" fill="#F0F6FC" class="font-sans" font-size="32" font-weight="800" letter-spacing="-0.5">Lakshay Rastogi</text>
      <text x="0" y="48" fill="#58A6FF" class="font-mono" font-size="12" font-weight="600">@CPS7 • Full-Stack Engineer &amp; Distributed Systems Architect</text>
    </g>

    <!-- Storytelling Tagline -->
    <g transform="translate(0, 108)">
      <text x="0" y="0" fill="#C9D1D9" class="font-sans" font-size="15" font-weight="500">
        "Every great system begins with a single commit. I architect software designed to scale, endure, and perform."
      </text>
    </g>
  </g>

  <!-- STORYTELLING GIT GRAPH TIMELINE (NATIVE GITHUB VISUAL) -->
  <g transform="translate(36, 215)">
    <!-- Branch Line: main (Blue) -->
    <path d="M 0,25 L 200,25 L 260,25 L 820,25" fill="none" stroke="#58A6FF" stroke-width="2.5" opacity="0.6"/>

    <!-- Branch Fork 1: Systems / Concurrency (Green) -->
    <path class="branch-trace" d="M 120,25 Q 150,25 170,55 L 420,55 Q 450,55 480,25" fill="none" stroke="#3FB950" stroke-width="2"/>

    <!-- Branch Fork 2: AI / Pipelines (Purple) -->
    <path class="branch-trace" d="M 300,25 Q 330,25 350,-10 L 600,-10 Q 630,-10 660,25" fill="none" stroke="#BC8CFF" stroke-width="2"/>

    <!-- Commit Nodes on Main -->
    <!-- Commit 1: Genesis -->
    <g transform="translate(40, 25)">
      <circle cx="0" cy="0" r="5" fill="#0D1117" stroke="#58A6FF" stroke-width="2.5"/>
      <text x="0" y="20" text-anchor="middle" fill="#8B949E" class="font-mono" font-size="9">init()</text>
    </g>

    <!-- Commit 2: CLI & Low-Level Engines -->
    <g transform="translate(180, 25)">
      <circle cx="0" cy="0" r="5" fill="#0D1117" stroke="#58A6FF" stroke-width="2.5"/>
      <text x="0" y="20" text-anchor="middle" fill="#8B949E" class="font-mono" font-size="9">CLI Engines</text>
    </g>

    <!-- Commit on Systems Branch: Distributed Audio/State -->
    <g transform="translate(290, 55)">
      <circle cx="0" cy="0" r="4.5" fill="#0D1117" stroke="#3FB950" stroke-width="2"/>
      <text x="0" y="18" text-anchor="middle" fill="#3FB950" class="font-mono" font-size="9">Lavalink / Real-Time</text>
    </g>

    <!-- Commit on AI Branch: LLMs & RAG -->
    <g transform="translate(450, -10)">
      <circle cx="0" cy="0" r="4.5" fill="#0D1117" stroke="#BC8CFF" stroke-width="2"/>
      <text x="0" y="-10" text-anchor="middle" fill="#BC8CFF" class="font-mono" font-size="9">AI &amp; Workflows</text>
    </g>

    <!-- Commit on Systems Branch: Scaled Backends -->
    <g transform="translate(400, 55)">
      <circle cx="0" cy="0" r="4.5" fill="#0D1117" stroke="#3FB950" stroke-width="2"/>
      <text x="0" y="18" text-anchor="middle" fill="#3FB950" class="font-mono" font-size="9">Sub-10ms APIs</text>
    </g>

    <!-- Commit 4: Modern Web Platforms (Next.js) -->
    <g transform="translate(560, 25)">
      <circle cx="0" cy="0" r="5" fill="#0D1117" stroke="#58A6FF" stroke-width="2.5"/>
      <text x="0" y="20" text-anchor="middle" fill="#8B949E" class="font-mono" font-size="9">Next.js 15 Web</text>
    </g>

    <!-- Commit 5: PRODUCTION MERGE (Golden Release Node) -->
    <g transform="translate(760, 25)">
      <circle class="active-commit" cx="0" cy="0" r="8" fill="#F2CC60" filter="url(#nodeGlow)"/>
      <circle cx="0" cy="0" r="4" fill="#0D1117"/>
      <text x="0" y="24" text-anchor="middle" fill="#F2CC60" class="font-mono" font-size="10" font-weight="700">v2026 (Live)</text>
    </g>
  </g>
</svg>
