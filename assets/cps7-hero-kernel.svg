<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <defs>
    <!-- Dark Matter Canvas -->
    <linearGradient id="kernelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="50%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Semantic Color System -->
    <linearGradient id="goldExecution" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="50%" stop-color="#F5CD79"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <linearGradient id="blueSystems" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="greenLive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="purpleAI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="heroBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="30%" stop-color="#F5CD79" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <filter id="subtleAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>

    <filter id="laserGlint" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.1); opacity: 0.6; }
    }
    @keyframes sweepLaser {
      0% { transform: translateX(-850px); }
      100% { transform: translateX(850px); }
    }
    @keyframes liveTick {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .orb-gold { animation: pulseOrb 6s ease-in-out infinite; transform-origin: 160px 140px; }
    .orb-blue { animation: pulseOrb 8s ease-in-out infinite reverse; transform-origin: 720px 180px; }
    .top-laser { animation: sweepLaser 5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .status-tick { animation: liveTick 2s ease-in-out infinite; }

    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
    }
    .font-mono {
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
    }
  </style>

  <!-- Base Container -->
  <rect x="1" y="1" width="848" height="358" rx="18" fill="url(#kernelBg)" stroke="url(#heroBorder)" stroke-width="1.2"/>

  <!-- Semantic Ambient Depth Orbs -->
  <circle class="orb-gold" cx="160" cy="140" r="130" fill="#D4AF37" filter="url(#subtleAura)"/>
  <circle class="orb-blue" cx="720" cy="180" r="140" fill="#0284C7" filter="url(#subtleAura)"/>

  <!-- Top Laser Hairline -->
  <g clip-path="url(#heroClip)">
    <line class="top-laser" x1="0" y1="1" x2="850" y2="1" stroke="url(#goldExecution)" stroke-width="2.5" filter="url(#laserGlint)"/>
  </g>

  <!-- TOP STATUS / KERNEL BAR -->
  <g transform="translate(36, 32)">
    <!-- Operating System Identifier -->
    <text x="0" y="0" fill="#F5CD79" class="font-mono" font-size="11" font-weight="700" letter-spacing="2">CPS7 :: KERNEL ARCHITECTURE</text>
    <text x="260" y="0" fill="#475569" class="font-mono" font-size="11">|</text>
    <text x="278" y="0" fill="#94A3B8" class="font-mono" font-size="11">SYSTEM v2.6.0</text>
    
    <!-- Right-aligned Live Status -->
    <g transform="translate(640, -10)">
      <rect x="0" y="0" width="138" height="22" rx="11" fill="#0E1724" stroke="#10B981" stroke-opacity="0.3"/>
      <circle class="status-tick" cx="12" cy="11" r="3.5" fill="#10B981"/>
      <text x="24" y="15" fill="#34D399" class="font-mono" font-size="9.5" font-weight="700" letter-spacing="1">LIVE &amp; DEPLOYING</text>
    </g>
  </g>

  <!-- CENTER: IDENTITY & PHILOSOPHY -->
  <g transform="translate(36, 85)">
    <!-- Codename + Actual Name -->
    <g>
      <!-- CPS7 Monogram Seal -->
      <rect x="0" y="0" width="76" height="76" rx="18" fill="#101622" stroke="url(#goldExecution)" stroke-width="1.2"/>
      <text x="38" y="44" text-anchor="middle" fill="url(#goldExecution)" class="font-sans" font-size="22" font-weight="900" letter-spacing="1" filter="url(#laserGlint)">CPS7</text>
      <circle cx="38" cy="58" r="2" fill="#F5CD79"/>
    </g>

    <!-- Name & Real Tagline -->
    <g transform="translate(96, 12)">
      <text x="0" y="24" fill="#FFFFFF" class="font-sans" font-size="34" font-weight="900" letter-spacing="-0.5">Lakshay Rastogi</text>
      <text x="0" y="48" fill="#F5CD79" class="font-mono" font-size="12" font-weight="700" letter-spacing="1.5">SYSTEMS ARCHITECT &amp; FULL-STACK BUILDER</text>
    </g>

    <!-- Lakshay's Non-Generic Manifesto Tagline -->
    <g transform="translate(0, 106)">
      <text x="0" y="0" fill="#E2E8F0" class="font-sans" font-size="16" font-weight="600">
        "I build software where architecture matters as much as the interface."
      </text>
      <text x="0" y="22" fill="#94A3B8" class="font-mono" font-size="12">
        From idea → robust architecture → zero-downtime production. Designed to survive real users.
      </text>
    </g>
  </g>

  <!-- SUBTLE DIVIDER -->
  <line x1="36" y1="240" x2="814" y2="240" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- BOTTOM: CONCRETE PROOF OF COMPETENCE (EVIDENCE TILES) -->
  <g transform="translate(36, 264)">
    <!-- Proof 1: Shipped Tools -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="58" rx="10" fill="#0E1420" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <circle cx="16" cy="18" r="3" fill="#F5CD79"/>
      <text x="26" y="21" fill="#94A3B8" class="font-mono" font-size="9" font-weight="700" letter-spacing="1">SYSTEMS SHIPPED</text>
      <text x="16" y="44" fill="#F5CD79" class="font-mono" font-size="16" font-weight="800">20+ Modules</text>
    </g>

    <!-- Proof 2: Production Codebases -->
    <g transform="translate(196, 0)">
      <rect x="0" y="0" width="186" height="58" rx="10" fill="#0E1420" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <circle cx="16" cy="18" r="3" fill="#38BDF8"/>
      <text x="26" y="21" fill="#94A3B8" class="font-mono" font-size="9" font-weight="700" letter-spacing="1">PRODUCTION STACKS</text>
      <text x="16" y="44" fill="#38BDF8" class="font-mono" font-size="16" font-weight="800">08 Active Systems</text>
    </g>

    <!-- Proof 3: CLI & Real-Time Engines -->
    <g transform="translate(398, 0)">
      <rect x="0" y="0" width="186" height="58" rx="10" fill="#0E1420" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <circle cx="16" cy="18" r="3" fill="#34D399"/>
      <text x="26" y="21" fill="#94A3B8" class="font-mono" font-size="9" font-weight="700" letter-spacing="1">CLI &amp; STREAM ENGINES</text>
      <text x="16" y="44" fill="#34D399" class="font-mono" font-size="16" font-weight="800">14+ Core Engines</text>
    </g>

    <!-- Proof 4: Engineering Mindset -->
    <g transform="translate(600, 0)">
      <rect x="0" y="0" width="178" height="58" rx="10" fill="#0E1420" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <circle cx="16" cy="18" r="3" fill="#A78BFA"/>
      <text x="26" y="21" fill="#94A3B8" class="font-mono" font-size="9" font-weight="700" letter-spacing="1">MINDSET</text>
      <text x="16" y="44" fill="#A78BFA" class="font-mono" font-size="14" font-weight="800">01 Uncompromising</text>
    </g>
  </g>
</svg>
