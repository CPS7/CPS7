<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="100%">
  <defs>
    <!-- Titanium Card Base Gradients -->
    <linearGradient id="cardMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="30%" stop-color="#0B0E14"/>
      <stop offset="70%" stop-color="#10151E"/>
      <stop offset="100%" stop-color="#07090D"/>
    </linearGradient>

    <!-- Holographic Rainbow Sheen -->
    <linearGradient id="holoSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E7E" stop-opacity="0"/>
      <stop offset="25%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#34D399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="35%" stop-color="#DFB15B"/>
      <stop offset="70%" stop-color="#F5CD79"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#DFB15B" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#DFB15B" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="foilGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="cardRadius">
      <rect x="125" y="10" width="600" height="280" rx="24"/>
    </clipPath>
  </defs>

  <style>
    @keyframes sheenPass {
      0% { transform: translateX(-600px) skewX(-20deg); }
      100% { transform: translateX(600px) skewX(-20deg); }
    }
    @keyframes chipPulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    .holo-reflection {
      animation: sheenPass 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .chip-glow {
      animation: chipPulse 3s ease-in-out infinite;
    }
    .font-card {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
    }
    .font-mono {
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
    }
  </style>

  <!-- Centered Card Container (600x280) -->
  <g transform="translate(0, 0)">
    <!-- Card Shadow Layer -->
    <rect x="127" y="14" width="596" height="276" rx="24" fill="#000000" opacity="0.6" filter="url(#foilGlow)"/>

    <!-- Main Card Body -->
    <rect x="125" y="10" width="600" height="280" rx="24" fill="url(#cardMetallic)" stroke="url(#goldBorder)" stroke-width="1.5"/>

    <!-- Holographic Light Sweep Across Card -->
    <g clip-path="url(#cardRadius)">
      <rect class="holo-reflection" x="125" y="10" width="300" height="280" fill="url(#holoSheen)" opacity="0.6"/>
      
      <!-- Micro-Circuit Decorative Lines -->
      <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
        <line x1="125" y1="100" x2="725" y2="100"/>
        <line x1="125" y1="200" x2="725" y2="200"/>
        <line x1="425" y1="10" x2="425" y2="290"/>
      </g>
    </g>

    <!-- Top Card Header: Left Issuer & Right Contactless Wave -->
    <g transform="translate(160, 42)">
      <text x="0" y="0" fill="url(#goldFoil)" class="font-card" font-size="18" font-weight="900" letter-spacing="2.5">CPS7 CENTURION</text>
      <text x="0" y="14" fill="#64748B" class="font-mono" font-size="8.5" font-weight="700" letter-spacing="1.5">TITANIUM DEVELOPER PASSPORT</text>

      <!-- Contactless Wave Signal -->
      <g transform="translate(480, -10)" stroke="url(#goldFoil)" stroke-width="1.8" fill="none" opacity="0.8">
        <path d="M 0,4 A 12,12 0 0,1 0,20"/>
        <path d="M 5,1 A 16,16 0 0,1 5,23"/>
        <path d="M 10,-2 A 20,20 0 0,1 10,26"/>
      </g>
    </g>

    <!-- Gold Embedded Smart Security Chip -->
    <g transform="translate(160, 85)">
      <rect class="chip-glow" x="0" y="0" width="56" height="42" rx="8" fill="#1C180E" stroke="url(#goldFoil)" stroke-width="1.4"/>
      <!-- Chip Wireframe Micro-Paths -->
      <line x1="0" y1="14" x2="56" y2="14" stroke="#DFB15B" stroke-width="0.8" opacity="0.7"/>
      <line x1="0" y1="28" x2="56" y2="28" stroke="#DFB15B" stroke-width="0.8" opacity="0.7"/>
      <line x1="28" y1="0" x2="28" y2="42" stroke="#DFB15B" stroke-width="0.8" opacity="0.7"/>
      <rect x="18" y="10" width="20" height="22" rx="4" fill="none" stroke="#DFB15B" stroke-width="1" opacity="0.9"/>
    </g>

    <!-- Card Cryptographic Number -->
    <g transform="translate(160, 172)">
      <text x="0" y="0" fill="url(#goldFoil)" class="font-mono" font-size="20" font-weight="700" letter-spacing="4" filter="url(#foilGlow)">
        0x7F • 4488 • 9921 • CPS7
      </text>
    </g>

    <!-- Cardholder & Tier Info (Bottom) -->
    <g transform="translate(160, 240)">
      <text x="0" y="-12" fill="#64748B" class="font-mono" font-size="8" font-weight="700" letter-spacing="1">CARDHOLDER / ARCHITECT</text>
      <text x="0" y="8" fill="#FFFFFF" class="font-card" font-size="16" font-weight="800" letter-spacing="1">LAKSHAY RASTOGI</text>

      <text x="320" y="-12" fill="#64748B" class="font-mono" font-size="8" font-weight="700" letter-spacing="1">SECURITY CLEARANCE</text>
      <text x="320" y="8" fill="#34D399" class="font-mono" font-size="14" font-weight="800">LEVEL-01 / GODSPEED</text>

      <!-- Authenticity Hologram Stamp -->
      <g transform="translate(480, -16)">
        <circle cx="20" cy="12" r="16" fill="#141B28" stroke="url(#goldFoil)" stroke-width="1"/>
        <text x="20" y="16" text-anchor="middle" fill="url(#goldFoil)" class="font-mono" font-size="9" font-weight="900">7</text>
      </g>
    </g>
  </g>
</svg>
