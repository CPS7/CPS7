<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <linearGradient id="isoDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D15"/>
      <stop offset="50%" stop-color="#0E1320"/>
      <stop offset="100%" stop-color="#06090F"/>
    </linearGradient>

    <linearGradient id="isoGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="100%" stop-color="#E5A93C"/>
    </linearGradient>

    <linearGradient id="isoCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="isoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>

    <filter id="isoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes flowLaser {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes float3DCube {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .flow-line {
      stroke-dasharray: 8 12;
      animation: flowLaser 3s linear infinite;
    }
    .iso-cube-group {
      animation: float3DCube 4s ease-in-out infinite;
      transform-origin: center;
    }
    .core-beacon {
      animation: pulseNode 2.5s ease-in-out infinite;
      transform-origin: 150px 120px;
    }
    .font-mono {
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
    }
  </style>

  <!-- Frame & Glass Container -->
  <rect x="1" y="1" width="848" height="238" rx="16" fill="url(#isoDarkBg)" stroke="url(#isoBorder)" stroke-width="1.2"/>

  <!-- Left: 3D Isometric Quantum Core Node -->
  <g class="iso-cube-group" transform="translate(40, 20)">
    <!-- Isometric Grid Lines -->
    <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
      <line x1="140" y1="20" x2="60" y2="70"/>
      <line x1="140" y1="20" x2="220" y2="70"/>
      <line x1="60" y1="70" x2="140" y2="120"/>
      <line x1="220" y1="70" x2="140" y2="120"/>
      <line x1="140" y1="120" x2="140" y2="190"/>
      <line x1="60" y1="70" x2="60" y2="140"/>
      <line x1="220" y1="70" x2="220" y2="140"/>
      <line x1="60" y1="140" x2="140" y2="190"/>
      <line x1="220" y1="140" x2="140" y2="190"/>
    </g>

    <!-- Top Isometric Face -->
    <polygon points="140,30 210,70 140,110 70,70" fill="#141C2B" stroke="url(#isoGoldGrad)" stroke-width="1.4"/>
    
    <!-- Left Isometric Face -->
    <polygon points="70,70 140,110 140,180 70,140" fill="#0A0E17" stroke="url(#isoCyanGrad)" stroke-width="1.2"/>

    <!-- Right Isometric Face -->
    <polygon points="140,110 210,70 210,140 140,180" fill="#0E1420" stroke="url(#isoGoldGrad)" stroke-width="1.2"/>

    <!-- Center Floating Holographic Orb -->
    <circle class="core-beacon" cx="140" cy="105" r="14" fill="#F5D77F" opacity="0.9" filter="url(#isoGlow)"/>
    <circle cx="140" cy="105" r="6" fill="#FFFFFF"/>

    <!-- Flowing Data Laser Tracks Leading Right -->
    <path class="flow-line" d="M 210,105 L 290,105 L 320,80 L 350,80" fill="none" stroke="#F5D77F" stroke-width="1.5" filter="url(#isoGlow)"/>
    <path class="flow-line" d="M 210,140 L 290,140 L 320,165 L 350,165" fill="none" stroke="#38BDF8" stroke-width="1.5" filter="url(#isoGlow)"/>
  </g>

  <!-- Right: High-Density Technical Telemetry Block -->
  <g transform="translate(360, 42)">
    <text x="0" y="0" fill="#64748B" class="font-mono" font-size="10" font-weight="700" letter-spacing="1.5">QUANTUM ARCHITECTURE PROTOCOL</text>
    <text x="0" y="24" fill="#FFFFFF" class="font-sans" font-size="20" font-weight="800">Deterministic Distributed Core</text>

    <!-- Diagnostics Breakdown Grid -->
    <g transform="translate(0, 48)">
      <!-- Row 1 -->
      <g>
        <rect x="0" y="0" width="220" height="34" rx="8" fill="#121724" stroke="#FFFFFF" stroke-opacity="0.05"/>
        <text x="14" y="21" fill="#94A3B8" class="font-mono" font-size="11">MEMORY ALLOC: <tspan fill="#34D399" font-weight="700">0.00 MB (Zero-Copy)</tspan></text>
      </g>

      <g transform="translate(230, 0)">
        <rect x="0" y="0" width="220" height="34" rx="8" fill="#121724" stroke="#FFFFFF" stroke-opacity="0.05"/>
        <text x="14" y="21" fill="#94A3B8" class="font-mono" font-size="11">CACHE HIT RATIO: <tspan fill="#F5D77F" font-weight="700">99.82% L1/L2</tspan></text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 44)">
        <rect x="0" y="0" width="220" height="34" rx="8" fill="#121724" stroke="#FFFFFF" stroke-opacity="0.05"/>
        <text x="14" y="21" fill="#94A3B8" class="font-mono" font-size="11">FAULT TOLERANCE: <tspan fill="#818CF8" font-weight="700">Self-Healing Mesh</tspan></text>
      </g>

      <g transform="translate(230, 44)">
        <rect x="0" y="0" width="220" height="34" rx="8" fill="#121724" stroke="#FFFFFF" stroke-opacity="0.05"/>
        <text x="14" y="21" fill="#94A3B8" class="font-mono" font-size="11">ENGINE STATUS: <tspan fill="#10B981" font-weight="700">ONLINE (100%)</tspan></text>
      </g>
    </g>
  </g>
</svg>
