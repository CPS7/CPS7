<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F141E"/>
      <stop offset="100%" stop-color="#080B10"/>
    </linearGradient>

    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="100%" stop-color="#E5BE64"/>
    </linearGradient>
  </defs>

  <style>
    .font-mono {
      font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, Monaco, monospace;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      animation: cursorBlink 1s infinite;
    }
    @keyframes fadeSeq1 {
      0%, 5% { opacity: 0; transform: translateY(4px); }
      10%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSeq2 {
      0%, 20% { opacity: 0; transform: translateY(4px); }
      25%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSeq3 {
      0%, 40% { opacity: 0; transform: translateY(4px); }
      45%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSeq4 {
      0%, 60% { opacity: 0; transform: translateY(4px); }
      65%, 100% { opacity: 1; transform: translateY(0); }
    }
    .seq-1 { animation: fadeSeq1 8s ease-out infinite; }
    .seq-2 { animation: fadeSeq2 8s ease-out infinite; }
    .seq-3 { animation: fadeSeq3 8s ease-out infinite; }
    .seq-4 { animation: fadeSeq4 8s ease-out infinite; }
  </style>

  <!-- Terminal Window Frame -->
  <rect x="1" y="1" width="848" height="248" rx="14" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.2"/>

  <!-- Top Title Bar -->
  <rect x="1" y="1" width="848" height="38" rx="14" fill="#141A26"/>
  <!-- Cover bottom rounded corners of the title bar -->
  <rect x="1" y="24" width="848" height="15" fill="#141A26"/>
  <line x1="1" y1="39" x2="849" y2="39" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>

  <!-- macOS Window Controls (Graphite Elegance) -->
  <circle cx="24" cy="20" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="42" cy="20" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="60" cy="20" r="5" fill="#10B981" opacity="0.8"/>

  <!-- Window Title -->
  <text x="425" y="24" text-anchor="middle" fill="#64748B" class="font-mono" font-size="11" font-weight="500">cps7@executive-workstation:~ (zsh)</text>

  <!-- Terminal Content Lines -->
  <g transform="translate(28, 70)">
    <!-- Command Line -->
    <g>
      <text x="0" y="0" fill="#10B981" class="font-mono" font-size="13" font-weight="600">❯</text>
      <text x="18" y="0" fill="#E2E8F0" class="font-mono" font-size="13" font-weight="600">cps7 --profile --diagnostics</text>
    </g>

    <!-- Output Line 1 -->
    <g class="seq-1" transform="translate(18, 28)">
      <text x="0" y="0" fill="#64748B" class="font-mono" font-size="12">› [SYSTEM ARCHITECTURE]</text>
      <text x="210" y="0" fill="#CBD5E1" class="font-mono" font-size="12">Distributed microservices &amp; sub-millisecond execution engines</text>
    </g>

    <!-- Output Line 2 -->
    <g class="seq-2" transform="translate(18, 54)">
      <text x="0" y="0" fill="#64748B" class="font-mono" font-size="12">› [FULL-STACK MATRIX]</text>
      <text x="210" y="0" fill="#CBD5E1" class="font-mono" font-size="12">Next.js 15, React 19, TypeScript, Rust, Python, GraphQL, Node.js</text>
    </g>

    <!-- Output Line 3 -->
    <g class="seq-3" transform="translate(18, 80)">
      <text x="0" y="0" fill="#64748B" class="font-mono" font-size="12">› [PRODUCTION SLA]</text>
      <text x="210" y="0" fill="#34D399" class="font-mono" font-size="12">Zero-downtime deployments • 99.999% availability target</text>
    </g>

    <!-- Next Active Prompt & Cursor -->
    <g class="seq-4" transform="translate(0, 114)">
      <text x="0" y="0" fill="#F5D77F" class="font-mono" font-size="13" font-weight="600">❯</text>
      <text x="18" y="0" fill="#94A3B8" class="font-mono" font-size="13">status: available for executive roles &amp; high-impact builds</text>
      <rect class="cursor" x="510" y="-11" width="7" height="14" fill="#F5D77F" rx="1"/>
    </g>
  </g>
</svg>
