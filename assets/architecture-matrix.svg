<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E121B"/>
      <stop offset="100%" stop-color="#080B11"/>
    </linearGradient>

    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C29B38"/>
      <stop offset="100%" stop-color="#F5D77F"/>
    </linearGradient>

    <linearGradient id="azureBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="emeraldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    }
    .font-mono {
      font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
    }
    @keyframes barGlow {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    .meter-fill {
      animation: barGlow 4s ease-in-out infinite;
    }
  </style>

  <!-- CARD 1: Core System Architecture -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="270" height="220" rx="14" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1"/>
    
    <!-- Top Icon & Header -->
    <circle cx="36" cy="36" r="16" fill="#171C28" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="36" y="41" text-anchor="middle" fill="#F5D77F" class="font-sans" font-size="14" font-weight="700">⚡</text>
    <text x="64" y="34" fill="#94A3B8" class="font-mono" font-size="10" font-weight="600" letter-spacing="1">PILLAR 01</text>
    <text x="64" y="49" fill="#F8FAFC" class="font-sans" font-size="14" font-weight="700">System Architecture</text>

    <!-- Subtitle / Bullet Items -->
    <text x="24" y="88" fill="#94A3B8" class="font-sans" font-size="12">• Distributed Microservices</text>
    <text x="24" y="108" fill="#94A3B8" class="font-sans" font-size="12">• Sub-10ms Latency Tuning</text>
    <text x="24" y="128" fill="#94A3B8" class="font-sans" font-size="12">• Fault-Tolerant Pipelines</text>

    <!-- Progress Metric -->
    <g transform="translate(24, 160)">
      <text x="0" y="0" fill="#64748B" class="font-mono" font-size="10">RELIABILITY INDEX</text>
      <text x="222" y="0" text-anchor="end" fill="#F5D77F" class="font-mono" font-size="10" font-weight="700">99.99%</text>
      <rect x="0" y="8" width="222" height="6" rx="3" fill="#171C28"/>
      <rect class="meter-fill" x="0" y="8" width="218" height="6" rx="3" fill="url(#goldGrad)"/>
    </g>
  </g>

  <!-- CARD 2: Full-Stack Engineering -->
  <g transform="translate(290, 0)">
    <rect x="0" y="0" width="270" height="220" rx="14" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1"/>
    
    <!-- Top Icon & Header -->
    <circle cx="36" cy="36" r="16" fill="#171C28" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="36" y="41" text-anchor="middle" fill="#818CF8" class="font-sans" font-size="14" font-weight="700">◆</text>
    <text x="64" y="34" fill="#94A3B8" class="font-mono" font-size="10" font-weight="600" letter-spacing="1">PILLAR 02</text>
    <text x="64" y="49" fill="#F8FAFC" class="font-sans" font-size="14" font-weight="700">Full-Stack &amp; Web</text>

    <!-- Subtitle / Bullet Items -->
    <text x="24" y="88" fill="#94A3B8" class="font-sans" font-size="12">• React / Next.js / TypeScript</text>
    <text x="24" y="108" fill="#94A3B8" class="font-sans" font-size="12">• High-Perf UI &amp; State Sync</text>
    <text x="24" y="128" fill="#94A3B8" class="font-sans" font-size="12">• Micro-Frontend Ecosystems</text>

    <!-- Progress Metric -->
    <g transform="translate(24, 160)">
      <text x="0" y="0" fill="#64748B" class="font-mono" font-size="10">EXECUTION FIDELITY</text>
      <text x="222" y="0" text-anchor="end" fill="#818CF8" class="font-mono" font-size="10" font-weight="700">99.4%</text>
      <rect x="0" y="8" width="222" height="6" rx="3" fill="#171C28"/>
      <rect class="meter-fill" x="0" y="8" width="210" height="6" rx="3" fill="url(#azureBar)"/>
    </g>
  </g>

  <!-- CARD 3: AI & Cloud Infrastructure -->
  <g transform="translate(580, 0)">
    <rect x="0" y="0" width="270" height="220" rx="14" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1"/>
    
    <!-- Top Icon & Header -->
    <circle cx="36" cy="36" r="16" fill="#171C28" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="36" y="41" text-anchor="middle" fill="#34D399" class="font-sans" font-size="14" font-weight="700">▲</text>
    <text x="64" y="34" fill="#94A3B8" class="font-mono" font-size="10" font-weight="600" letter-spacing="1">PILLAR 03</text>
    <text x="64" y="49" fill="#F8FAFC" class="font-sans" font-size="14" font-weight="700">AI &amp; Cloud Systems</text>

    <!-- Subtitle / Bullet Items -->
    <text x="24" y="88" fill="#94A3B8" class="font-sans" font-size="12">• LLM Pipelines &amp; RAG Systems</text>
    <text x="24" y="108" fill="#94A3B8" class="font-sans" font-size="12">• Container Orchestration</text>
    <text x="24" y="128" fill="#94A3B8" class="font-sans" font-size="12">• Edge Compute &amp; Serverless</text>

    <!-- Progress Metric -->
    <g transform="translate(24, 160)">
      <text x="0" y="0" fill="#64748B" class="font-mono" font-size="10">AUTOMATION INDEX</text>
      <text x="222" y="0" text-anchor="end" fill="#34D399" class="font-mono" font-size="10" font-weight="700">98.8%</text>
      <rect x="0" y="8" width="222" height="6" rx="3" fill="#171C28"/>
      <rect class="meter-fill" x="0" y="8" width="206" height="6" rx="3" fill="url(#emeraldBar)"/>
    </g>
  </g>
</svg>
