<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%">
  <defs>
    <!-- Background Space & Glass Materials -->
    <linearGradient id="heroDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="40%" stop-color="#0A0E17"/>
      <stop offset="80%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>

    <!-- Luxury Pure Gold Gradient -->
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEBB0"/>
      <stop offset="25%" stop-color="#F3C866"/>
      <stop offset="50%" stop-color="#E5A93C"/>
      <stop offset="75%" stop-color="#F5D77F"/>
      <stop offset="100%" stop-color="#C28C28"/>
    </linearGradient>

    <!-- Titanium Platinum Mirror Gradient -->
    <linearGradient id="platinumMirror" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Glowing Laser Sweep Gradient -->
    <linearGradient id="laserSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F3C866" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F3C866" stop-opacity="1"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="borderShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="35%" stop-color="#F3C866" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Soft Atmospheric Glows -->
    <filter id="ambientDepth" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>

    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>

    <!-- 3D Polyhedron Clip/Transform -->
    <clipPath id="cardClip">
      <rect x="1" y="1" width="848" height="338" rx="20"/>
    </clipPath>
  </defs>

  <style>
    @keyframes rotate3D {
      0% { transform: rotateY(0deg) rotateX(15deg) rotateZ(0deg); }
      50% { transform: rotateY(180deg) rotateX(-15deg) rotateZ(180deg); }
      100% { transform: rotateY(360deg) rotateX(15deg) rotateZ(360deg); }
    }
    @keyframes pulseAura {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.55; }
    }
    @keyframes beamGlide {
      0% { transform: translateX(-900px); }
      100% { transform: translateX(900px); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
      50% { transform: translateY(-8px) scale(1.2); opacity: 0.9; }
    }
    @keyframes statusTick {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .aura-gold { animation: pulseAura 7s ease-in-out infinite; transform-origin: 200px 140px; }
    .aura-indigo { animation: pulseAura 9s ease-in-out infinite reverse; transform-origin: 700px 180px; }
    .laser-beam { animation: beamGlide 5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .particle-1 { animation: floatParticle 4s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 6s ease-in-out infinite 1.5s; }
    .particle-3 { animation: floatParticle 5s ease-in-out infinite 3s; }
    .status-beacon { animation: statusTick 2s ease-in-out infinite; }

    .font-display {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
    }
    .font-mono {
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, monospace;
    }
  </style>

  <!-- Card Frame & Glass Body -->
  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="848" height="338" rx="20" fill="url(#heroDarkBg)"/>

    <!-- Ambient Atmospheric Glow Orbs -->
    <circle class="aura-gold" cx="180" cy="140" r="140" fill="#E5A93C" filter="url(#ambientDepth)"/>
    <circle class="aura-indigo" cx="700" cy="180" r="130" fill="#6366F1" filter="url(#ambientDepth)"/>

    <!-- Subtle Optical Geometric Grid -->
    <g opacity="0.04" stroke="#FFFFFF" stroke-width="0.8">
      <line x1="0" y1="85" x2="850" y2="85"/>
      <line x1="0" y1="170" x2="850" y2="170"/>
      <line x1="0" y1="255" x2="850" y2="255"/>
      <line x1="212" y1="0" x2="212" y2="340"/>
      <line x1="425" y1="0" x2="425" y2="340"/>
      <line x1="637" y1="0" x2="637" y2="340"/>
    </g>

    <!-- Top Laser Sweep Line -->
    <line class="laser-beam" x1="0" y1="1" x2="850" y2="1" stroke="url(#laserSweep)" stroke-width="3" filter="url(#laserGlow)"/>

    <!-- Floating Micro-Particles -->
    <circle class="particle-1" cx="240" cy="90" r="1.5" fill="#FFEBB0"/>
    <circle class="particle-2" cx="640" cy="120" r="2" fill="#818CF8"/>
    <circle class="particle-3" cx="480" cy="60" r="1.5" fill="#34D399"/>
    <circle class="particle-1" cx="350" cy="270" r="2" fill="#FFEBB0"/>

    <!-- LEFT: High-Prestige Monogram Seal -->
    <g transform="translate(46, 52)">
      <!-- Outer Hex/Chamfer Plate -->
      <rect x="0" y="0" width="104" height="104" rx="26" fill="#0E131F" stroke="url(#borderShimmer)" stroke-width="1.5"/>
      <rect x="6" y="6" width="92" height="92" rx="20" fill="#080B12" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
      
      <!-- Inner Optical Micro-Ring -->
      <circle cx="52" cy="52" r="36" fill="none" stroke="url(#goldLuxury)" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
      
      <!-- Center Monogram -->
      <text x="52" y="58" text-anchor="middle" fill="url(#goldLuxury)" class="font-display" font-size="28" font-weight="900" letter-spacing="1" filter="url(#laserGlow)">CPS7</text>
      <text x="52" y="78" text-anchor="middle" fill="#94A3B8" class="font-mono" font-size="8" font-weight="700" letter-spacing="2">ARCHITECT</text>
    </g>

    <!-- CENTER-RIGHT: Master Executive Typography -->
    <g transform="translate(176, 68)">
      <!-- Prestige Kicker Badge -->
      <g>
        <rect x="0" y="0" width="220" height="22" rx="11" fill="#141B2B" stroke="#F3C866" stroke-opacity="0.3" stroke-width="1"/>
        <circle class="status-beacon" cx="12" cy="11" r="3.5" fill="#10B981"/>
        <text x="24" y="15" fill="#F3C866" class="font-mono" font-size="9.5" font-weight="700" letter-spacing="1.5">VERIFIED SYSTEMS ARCHITECT</text>
      </g>

      <!-- Main Name (High Optical Hierarchy) -->
      <text x="0" y="58" fill="url(#platinumMirror)" class="font-display" font-size="40" font-weight="900" letter-spacing="-0.8">Lakshay Rastogi</text>

      <!-- Tagline with psychological high-status anchoring -->
      <text x="0" y="86" fill="#CBD5E1" class="font-display" font-size="16" font-weight="500">
        Engineering high-throughput distributed systems &amp; elite full-stack platforms.
      </text>
      
      <text x="0" y="108" fill="#64748B" class="font-mono" font-size="12">
        Zero-Allocation Protocols • Sub-Millisecond Compute • Autonomous AI Pipelines
      </text>
    </g>

    <!-- RIGHT: Mini Holographic Telemetry Dial -->
    <g transform="translate(730, 68)">
      <circle cx="40" cy="40" r="34" fill="#0C101A" stroke="url(#borderShimmer)" stroke-width="1.2"/>
      <circle cx="40" cy="40" r="26" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="120 40" opacity="0.8"/>
      <text x="40" y="38" text-anchor="middle" fill="#F3C866" class="font-mono" font-size="12" font-weight="800">99.99</text>
      <text x="40" y="49" text-anchor="middle" fill="#94A3B8" class="font-mono" font-size="7" font-weight="600">% SLA</text>
    </g>

    <!-- Divider Line -->
    <line x1="46" y1="230" x2="804" y2="230" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Bottom Luxury Status HUD Bar -->
    <g transform="translate(46, 258)">
      <!-- Metric 1: Latency -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="48" rx="10" fill="#0E1320" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
        <text x="16" y="18" fill="#64748B" class="font-mono" font-size="9" font-weight="600">EXECUTION LATENCY</text>
        <text x="16" y="37" fill="#34D399" class="font-mono" font-size="14" font-weight="800">⚡ &lt; 2.4 ms</text>
      </g>

      <!-- Metric 2: Concurrency -->
      <g transform="translate(182, 0)">
        <rect x="0" y="0" width="186" height="48" rx="10" fill="#0E1320" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
        <text x="16" y="18" fill="#64748B" class="font-mono" font-size="9" font-weight="600">STREAM CONCURRENCY</text>
        <text x="16" y="37" fill="#F3C866" class="font-mono" font-size="14" font-weight="800">◆ 100K+ req/s</text>
      </g>

      <!-- Metric 3: Architecture Tier -->
      <g transform="translate(382, 0)">
        <rect x="0" y="0" width="186" height="48" rx="10" fill="#0E1320" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
        <text x="16" y="18" fill="#64748B" class="font-mono" font-size="9" font-weight="600">CODE INTEGRITY TIER</text>
        <text x="16" y="37" fill="#818CF8" class="font-mono" font-size="14" font-weight="800">▲ Tier-1 Proven</text>
      </g>

      <!-- Metric 4: Direct Availability -->
      <g transform="translate(582, 0)">
        <rect x="0" y="0" width="176" height="48" rx="10" fill="#0E1320" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
        <text x="16" y="18" fill="#64748B" class="font-mono" font-size="9" font-weight="600">COMMUNICATION</text>
        <text x="16" y="37" fill="#F8FAFC" class="font-mono" font-size="13" font-weight="700">🟢 Direct Dispatch</text>
      </g>
    </g>
  </g>

  <!-- Outer Hairline Precision Border -->
  <rect x="1" y="1" width="848" height="338" rx="20" fill="none" stroke="url(#borderShimmer)" stroke-width="1.2"/>
</svg>
