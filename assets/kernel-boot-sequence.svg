<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bootBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#06080D"/>
    </linearGradient>
    <linearGradient id="bootBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <style>
    .font-mono {
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Menlo, monospace;
    }
    @keyframes pulseOk {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    .ok-badge {
      animation: pulseOk 2s ease-in-out infinite;
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="848" height="118" rx="12" fill="url(#bootBg)" stroke="url(#bootBorder)" stroke-width="1"/>

  <!-- Boot Transition Log Content -->
  <g transform="translate(24, 28)">
    <!-- Line 1: Header -->
    <g>
      <text x="0" y="0" fill="#F5CD79" class="font-mono" font-size="11" font-weight="700">❯ CPS7.boot_sequence()</text>
      <text x="210" y="0" fill="#475569" class="font-mono" font-size="11">.............................................................</text>
      <text x="750" y="0" fill="#10B981" class="font-mono font-weight-700" font-size="11" font-weight="700">LOADED</text>
    </g>

    <!-- Sub-steps Grid -->
    <g transform="translate(0, 24)">
      <!-- Step 1 -->
      <text x="0" y="0" fill="#64748B" class="font-mono" font-size="10.5">├─ [01_IDENTITY]</text>
      <text x="125" y="0" fill="#CBD5E1" class="font-mono" font-size="10.5">Lakshay Rastogi (CPS7)</text>
      <text x="320" y="0" fill="#34D399" class="font-mono ok-badge" font-size="10.5" font-weight="700">[OK]</text>

      <!-- Step 2 -->
      <text x="420" y="0" fill="#64748B" class="font-mono" font-size="10.5">├─ [02_WHAT_I_BUILD]</text>
      <text x="575" y="0" fill="#CBD5E1" class="font-mono" font-size="10.5">Distributed Engines</text>
      <text x="750" y="0" fill="#34D399" class="font-mono ok-badge" font-size="10.5" font-weight="700">[OK]</text>
    </g>

    <g transform="translate(0, 48)">
      <!-- Step 3 -->
      <text x="0" y="0" fill="#64748B" class="font-mono" font-size="10.5">├─ [03_HOW_I_THINK]</text>
      <text x="125" y="0" fill="#CBD5E1" class="font-mono" font-size="10.5">First-Principles Laws</text>
      <text x="320" y="0" fill="#34D399" class="font-mono ok-badge" font-size="10.5" font-weight="700">[OK]</text>

      <!-- Step 4 -->
      <text x="420" y="0" fill="#64748B" class="font-mono" font-size="10.5">└─ [04_SYSTEMS_ACTIVE]</text>
      <text x="575" y="0" fill="#CBD5E1" class="font-mono" font-size="10.5">Production Deployments</text>
      <text x="750" y="0" fill="#34D399" class="font-mono ok-badge" font-size="10.5" font-weight="700">[OK]</text>
    </g>
  </g>
</svg>
