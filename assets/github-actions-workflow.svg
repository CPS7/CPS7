<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <filter id="actionGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-gh { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  </style>

  <!-- GitHub Actions Frame (#0D1117 & #30363D) -->
  <rect x="0.5" y="0.5" width="899" height="179" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Top Bar (#161B22) -->
  <path d="M 0.5,6.5 Q 0.5,0.5 6.5,0.5 L 893.5,0.5 Q 899.5,0.5 899.5,6.5 L 899.5,38 L 0.5,38 Z" fill="#161B22"/>
  <line x1="0.5" y1="38" x2="899.5" y2="38" stroke="#30363D" stroke-width="1"/>

  <!-- Header Left: Workflow Run Title -->
  <g transform="translate(24, 24)">
    <!-- GitHub Actions Play Icon -->
    <circle cx="8" cy="-1" r="7" fill="#238636"/>
    <path fill="#FFFFFF" transform="translate(5, -4) scale(0.65)" d="M9.525 5.636a.75.75 0 00-.814-.15l-6.25 2.5a.75.75 0 000 1.393l6.25 2.5a.75.75 0 001.039-.696V5.985a.75.75 0 00-.225-.349z"/>
    
    <text x="24" y="3" fill="#F0F6FC" class="font-gh" font-size="12.5" font-weight="600">
      GitHub Actions Workflow <tspan fill="#484F58">/</tspan> <tspan fill="#58A6FF">production-deploy.yml</tspan>
    </text>
    
    <rect x="360" y="-8" width="70" height="18" rx="4" fill="#1F6FEB" opacity="0.2"/>
    <text x="395" y="5" text-anchor="middle" fill="#58A6FF" class="font-mono" font-size="10" font-weight="600">run #418</text>
  </g>

  <!-- Header Right: Telemetry Time -->
  <g transform="translate(740, 24)">
    <text x="0" y="3" fill="#8B949E" class="font-mono" font-size="11">
      Duration: <tspan fill="#3FB950" font-weight="700">269ms</tspan>
    </text>
  </g>

  <!-- CI/CD Job Steps (4 GitHub Action Matrix Columns) -->
  <g transform="translate(24, 56)">
    <!-- Step 1: Linux Build -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="200" height="104" rx="6" fill="#161B22" stroke="#30363D"/>
      <!-- Checkmark -->
      <circle cx="20" cy="22" r="7" fill="#238636"/>
      <path fill="#FFFFFF" transform="translate(16, 18) scale(0.55)" d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/>
      <text x="34" y="26" fill="#F0F6FC" class="font-gh" font-size="12" font-weight="600">build-linux-x64</text>
      <text x="20" y="52" fill="#8B949E" class="font-mono" font-size="10.5">Runner: ubuntu-latest</text>
      <text x="20" y="70" fill="#8B949E" class="font-mono" font-size="10.5">Latency: <tspan fill="#3FB950">42ms</tspan></text>
      <text x="20" y="88" fill="#58A6FF" class="font-mono" font-size="10">✓ C++20 Clang Core</text>
    </g>

    <!-- Step 2: Distributed Test Matrix -->
    <g transform="translate(216, 0)">
      <rect x="0" y="0" width="200" height="104" rx="6" fill="#161B22" stroke="#30363D"/>
      <circle cx="20" cy="22" r="7" fill="#238636"/>
      <path fill="#FFFFFF" transform="translate(16, 18) scale(0.55)" d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/>
      <text x="34" y="26" fill="#F0F6FC" class="font-gh" font-size="12" font-weight="600">distributed-tests</text>
      <text x="20" y="52" fill="#8B949E" class="font-mono" font-size="10.5">Coverage: <tspan fill="#3FB950">99.4%</tspan></text>
      <text x="20" y="70" fill="#8B949E" class="font-mono" font-size="10.5">Concurrency: 16 Workers</text>
      <text x="20" y="88" fill="#58A6FF" class="font-mono" font-size="10">✓ 142/142 Assertions</text>
    </g>

    <!-- Step 3: Next.js Platform Build -->
    <g transform="translate(432, 0)">
      <rect x="0" y="0" width="200" height="104" rx="6" fill="#161B22" stroke="#30363D"/>
      <circle cx="20" cy="22" r="7" fill="#238636"/>
      <path fill="#FFFFFF" transform="translate(16, 18) scale(0.55)" d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/>
      <text x="34" y="26" fill="#F0F6FC" class="font-gh" font-size="12" font-weight="600">build-web-edge</text>
      <text x="20" y="52" fill="#8B949E" class="font-mono" font-size="10.5">Framework: Next.js 15</text>
      <text x="20" y="70" fill="#8B949E" class="font-mono" font-size="10.5">Bundle Size: <tspan fill="#3FB950">44.8 kB</tspan></text>
      <text x="20" y="88" fill="#58A6FF" class="font-mono" font-size="10">✓ TypeScript Strict</text>
    </g>

    <!-- Step 4: Edge Production Deployment -->
    <g transform="translate(648, 0)">
      <rect x="0" y="0" width="204" height="104" rx="6" fill="#161B22" stroke="#30363D"/>
      <circle cx="20" cy="22" r="7" fill="#238636"/>
      <path fill="#FFFFFF" transform="translate(16, 18) scale(0.55)" d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z"/>
      <text x="34" y="26" fill="#F0F6FC" class="font-gh" font-size="12" font-weight="600">deploy-production</text>
      <text x="20" y="52" fill="#8B949E" class="font-mono" font-size="10.5">Target: Edge Global</text>
      <text x="20" y="70" fill="#8B949E" class="font-mono" font-size="10.5">Status: <tspan fill="#3FB950">Active</tspan></text>
      <text x="20" y="88" fill="#A371F7" class="font-mono" font-size="10">● Production Live</text>
    </g>
  </g>
</svg>
