<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <defs>
    <!-- Clean Platinum Logo Fill -->
    <linearGradient id="logoPure" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F6FC"/>
    </linearGradient>

    <!-- Contribution Green Gradient -->
    <linearGradient id="ghGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#39D353"/>
      <stop offset="100%" stop-color="#26A641"/>
    </linearGradient>

    <filter id="skylineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-gh {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    }
  </style>

  <!-- Real GitHub Dark Mode Box Card (6px radius, #0D1117 background, #30363D border) -->
  <rect x="0.5" y="0.5" width="899" height="339" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Top GitHub Header Bar (#161B22) -->
  <path d="M 0.5,6.5 Q 0.5,0.5 6.5,0.5 L 893.5,0.5 Q 899.5,0.5 899.5,6.5 L 899.5,44 L 0.5,44 Z" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <line x1="0.5" y1="44" x2="899.5" y2="44" stroke="#30363D" stroke-width="1"/>

  <!-- Top GitHub Header Left: Breadcrumbs -->
  <g transform="translate(24, 27)">
    <!-- GitHub Invertocat Vector Logo -->
    <path fill="#F0F6FC" transform="translate(0, -12) scale(1.15)" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
    
    <text x="28" y="1" fill="#8B949E" class="font-gh" font-size="13">
      <tspan fill="#58A6FF" font-weight="600">CPS7</tspan>
      <tspan fill="#484F58"> / </tspan>
      <tspan fill="#F0F6FC" font-weight="600">README.md</tspan>
    </text>

    <!-- Public Badge -->
    <rect x="188" y="-11" width="52" height="18" rx="9" fill="#21262D" stroke="#30363D"/>
    <text x="214" y="2" text-anchor="middle" fill="#8B949E" class="font-gh" font-size="10" font-weight="600">Public</text>
  </g>

  <!-- Top GitHub Header Right: Subnav Tab Pills -->
  <g transform="translate(620, 27)">
    <!-- Branch Pill -->
    <g transform="translate(0, -9)">
      <rect x="0" y="0" width="82" height="20" rx="4" fill="#21262D" stroke="#30363D"/>
      <!-- Git Branch Icon -->
      <path fill="#8B949E" transform="translate(8, 4) scale(0.75)" d="M5 3.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm0 2.122a2.25 2.25 0 10-1.5 0v5.256a2.25 2.25 0 101.5 0V5.372zm5.75 4.378a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm0 2.122a2.25 2.25 0 10-1.5 0v-.672a1.75 1.75 0 00-1.75-1.75h-1a.75.75 0 010-1.5h1A3.25 3.25 0 0110.75 11.2v.622z"/>
      <text x="24" y="14" fill="#F0F6FC" class="font-mono" font-size="11" font-weight="600">main</text>
    </g>

    <!-- Live Status Pill -->
    <g transform="translate(94, -9)">
      <rect x="0" y="0" width="162" height="20" rx="4" fill="#21262D" stroke="#30363D"/>
      <circle cx="10" cy="10" r="3.5" fill="#3FB950"/>
      <text x="20" y="14" fill="#8B949E" class="font-mono" font-size="10.5">latest commit <tspan fill="#58A6FF">6bb6655</tspan></text>
    </g>
  </g>

  <!-- CENTER-ALIGNED IDENTITY AREA (#0D1117) -->
  <g transform="translate(450, 56)">
