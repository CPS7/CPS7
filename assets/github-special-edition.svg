      <circle cx="0" cy="0" r="34" fill="#0D1117"/>
      
      <!-- Official GitHub Invertocat Silhouette as Background inside Avatar -->
      <path fill="#21262D" stroke="#30363D" stroke-width="0.5" transform="translate(-23, -23) scale(2.9)" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>

      <!-- Clean Bold CPS7 Text Layered Over Logo -->
      <text x="0" y="7" text-anchor="middle" fill="url(#logoPure)" class="font-gh" font-size="19" font-weight="900" letter-spacing="1">CPS7</text>
    </g>

    <!-- Main Title & Bio Details (Symmetrically Centered) -->
    <g transform="translate(0, 94)">
      <!-- Name -->
      <text x="0" y="16" text-anchor="middle" fill="#F0F6FC" class="font-gh" font-size="28" font-weight="800" letter-spacing="-0.5">Lakshay Rastogi</text>

      <!-- Handle & Role Subtitle -->
      <text x="0" y="42" text-anchor="middle" fill="#8B949E" class="font-gh" font-size="14" font-weight="500">
        <tspan fill="#58A6FF" font-weight="600" class="font-mono">@CPS7</tspan> • Full-Stack Engineer &amp; Systems Builder
      </text>

      <!-- Tagline / Manifesto -->
      <text x="0" y="66" text-anchor="middle" fill="#C9D1D9" class="font-gh" font-size="13">
        "Building software where architecture matters as much as the interface."
      </text>
    </g>

    <!-- CENTERED GITHUB CONTRIBUTION SKYLINE 3D MATRIX -->
    <g transform="translate(-165, 184)" filter="url(#skylineGlow)">
      <!-- 3D Skyline Wave Bars -->
      <rect x="0" y="14" width="6" height="18" rx="1.5" fill="#0E4429"/>
      <rect x="9" y="8" width="6" height="24" rx="1.5" fill="#006D32"/>
