<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" height="100%">
  <defs>
    <!-- Clean Platinum Logo Fill -->
    <linearGradient id="logoPure" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F6FC"/>
    </linearGradient>

    <!-- Cartoon Metallic Armor Gradients -->
    <linearGradient id="ironRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <linearGradient id="ironGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="arcCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="skylineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="arcGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-gh {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    }

    /* Iron Man Patrol Walk Animation (Left & Right with Flip) */
    @keyframes ironManPatrol {
      0%, 5% { transform: translateX(0px) scaleX(1); }
      45%, 50% { transform: translateX(-95px) scaleX(1); }
      51%, 55% { transform: translateX(-95px) scaleX(-1); }
      95%, 100% { transform: translateX(0px) scaleX(-1); }
    }

    /* Bobbing Walking Strides */
    @keyframes stepCycle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-2.5px) rotate(2deg); }
      50% { transform: translateY(0px) rotate(0deg); }
      75% { transform: translateY(-2.5px) rotate(-2deg); }
    }

    @keyframes legStrideLeft {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(18deg); }
      50% { transform: rotate(0deg); }
      75% { transform: rotate(-18deg); }
    }

    @keyframes legStrideRight {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-18deg); }
      50% { transform: rotate(0deg); }
      75% { transform: rotate(18deg); }
    }

    .patrol-group {
      animation: ironManPatrol 7s ease-in-out infinite;
    }
    .body-bob {
      animation: stepCycle 0.6s ease-in-out infinite;
      transform-origin: 0px 30px;
    }
    .leg-left {
      animation: legStrideLeft 0.6s ease-in-out infinite;
      transform-origin: -4px 30px;
    }
    .leg-right {
      animation: legStrideRight 0.6s ease-in-out infinite;
      transform-origin: 4px 30px;
    }
  </style>

  <!-- Real GitHub Dark Mode Box Card (6px radius, #0D1117 background, #30363D border) -->
  <rect x="0.5" y="0.5" width="899" height="269" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

  <!-- Top GitHub Header Bar (#161B22) -->
  <path d="M 0.5,6.5 Q 0.5,0.5 6.5,0.5 L 893.5,0.5 Q 899.5,0.5 899.5,6.5 L 899.5,42 L 0.5,42 Z" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <line x1="0.5" y1="42" x2="899.5" y2="42" stroke="#30363D" stroke-width="1"/>

  <!-- Top GitHub Header Content -->
  <g transform="translate(24, 26)">
    <!-- Real Official GitHub Invertocat Vector Logo -->
    <path fill="#F0F6FC" transform="translate(0, -12) scale(1.2)" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
    
    <text x="28" y="1" fill="#8B949E" class="font-mono" font-size="12">
      <tspan fill="#58A6FF" font-weight="600">github.com</tspan> / <tspan fill="#F0F6FC" font-weight="600">CPS7</tspan>
    </text>
  </g>

  <!-- CENTER IDENTITY AREA (#0D1117) -->
  <g transform="translate(28, 64)">
    <!-- GitHub Circle Avatar with GitHub Logo Background & CPS7 Mark -->
    <g>
      <!-- Circle Frame -->
      <circle cx="45" cy="45" r="45" fill="#21262D" stroke="#30363D" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="43" fill="#0D1117"/>
      
      <!-- Official GitHub Invertocat Silhouette as Background inside Avatar -->
      <path fill="#21262D" stroke="#30363D" stroke-width="0.5" transform="translate(15, 15) scale(3.75)" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>

      <!-- Clean Bold CPS7 Text Layered Over Logo -->
      <text x="45" y="53" text-anchor="middle" fill="url(#logoPure)" class="font-gh" font-size="24" font-weight="900" letter-spacing="1">CPS7</text>
    </g>

    <!-- Main Title & Bio Details -->
    <g transform="translate(112, 10)">
      <!-- Name & Handle (Perfect Relative Flow) -->
      <text x="0" y="24" class="font-gh">
        <tspan fill="#F0F6FC" font-size="28" font-weight="800" letter-spacing="-0.5">Lakshay Rastogi</tspan>
        <tspan dx="12" fill="#58A6FF" class="font-mono" font-size="15" font-weight="600">@CPS7</tspan>
      </text>

      <!-- Subtitle -->
      <text x="0" y="48" fill="#8B949E" class="font-gh" font-size="14" font-weight="500">
        Full-Stack Engineer &amp; Systems Builder
      </text>

      <!-- Tagline / Manifesto -->
      <text x="0" y="72" fill="#C9D1D9" class="font-gh" font-size="13">
        "Building software where architecture matters as much as the interface."
      </text>
    </g>

    <!-- RIGHT: GITHUB SKYLINE CONTRIBUTION 3D BARS -->
    <g transform="translate(570, 6)" filter="url(#skylineGlow)">
      <rect x="0" y="0" width="276" height="92" rx="6" fill="#161B22" stroke="#30363D"/>
      
      <text x="14" y="20" fill="#8B949E" class="font-mono" font-size="9" font-weight="600">GITHUB CONTRIBUTION SKYLINE</text>
      <text x="14" y="36" fill="#58A6FF" class="font-mono" font-size="12" font-weight="700">52-Week Velocity Matrix</text>

      <!-- 3D Skyline Wave Bars -->
      <g transform="translate(14, 48)">
        <rect x="0" y="16" width="6" height="20" rx="1.5" fill="#0E4429"/>
        <rect x="9" y="10" width="6" height="26" rx="1.5" fill="#006D32"/>
        <rect x="18" y="4" width="6" height="32" rx="1.5" fill="#26A641"/>
        <rect x="27" y="0" width="6" height="36" rx="1.5" fill="#39D353"/>
        <rect x="36" y="8" width="6" height="28" rx="1.5" fill="#26A641"/>
        <rect x="45" y="14" width="6" height="22" rx="1.5" fill="#006D32"/>
        <rect x="54" y="2" width="6" height="34" rx="1.5" fill="#39D353"/>
        <rect x="63" y="6" width="6" height="30" rx="1.5" fill="#26A641"/>
        <rect x="72" y="12" width="6" height="24" rx="1.5" fill="#006D32"/>
        <rect x="81" y="0" width="6" height="36" rx="1.5" fill="#39D353"/>
        <rect x="90" y="4" width="6" height="32" rx="1.5" fill="#39D353"/>
        <rect x="99" y="8" width="6" height="28" rx="1.5" fill="#26A641"/>
        <rect x="108" y="16" width="6" height="20" rx="1.5" fill="#0E4429"/>
        <rect x="117" y="6" width="6" height="30" rx="1.5" fill="#26A641"/>
        <rect x="126" y="0" width="6" height="36" rx="1.5" fill="#39D353"/>
        <rect x="135" y="2" width="6" height="34" rx="1.5" fill="#39D353"/>
        <rect x="144" y="10" width="6" height="26" rx="1.5" fill="#26A641"/>
        <rect x="153" y="4" width="6" height="32" rx="1.5" fill="#39D353"/>
        <rect x="162" y="14" width="6" height="22" rx="1.5" fill="#006D32"/>
        <rect x="171" y="0" width="6" height="36" rx="1.5" fill="#39D353"/>
        <rect x="180" y="8" width="6" height="28" rx="1.5" fill="#26A641"/>
        <rect x="189" y="4" width="6" height="32" rx="1.5" fill="#39D353"/>
        <rect x="198" y="12" width="6" height="24" rx="1.5" fill="#006D32"/>
        <rect x="207" y="0" width="6" height="36" rx="1.5" fill="#39D353"/>
        <rect x="216" y="6" width="6" height="30" rx="1.5" fill="#26A641"/>
        <rect x="225" y="0" width="6" height="36" rx="1.5" fill="#39D353"/>
        <rect x="234" y="10" width="6" height="26" rx="1.5" fill="#26A641"/>
        <rect x="243" y="0" width="6" height="36" rx="1.5" fill="#39D353"/>
      </g>
    </g>
  </g>

  <!-- LOWER METADATA BAR (#161B22) -->
  <line x1="0.5" y1="210" x2="899.5" y2="210" stroke="#30363D" stroke-width="1"/>
  <path d="M 0.5,210 L 899.5,210 L 899.5,263.5 Q 899.5,269.5 893.5,269.5 L 6.5,269.5 Q 0.5,269.5 0.5,263.5 Z" fill="#161B22"/>

  <g transform="translate(28, 246)">
    <!-- Pill 1: Repos -->
    <g>
      <text x="0" y="0" fill="#8B949E" class="font-mono" font-size="10">REPOSITORIES</text>
      <text x="90" y="0" fill="#F0F6FC" class="font-gh" font-size="13" font-weight="700">20+ Shipped Modules</text>
    </g>

    <!-- Pill 2: Stack -->
    <g transform="translate(265, 0)">
      <text x="0" y="0" fill="#8B949E" class="font-mono" font-size="10">RUNTIME</text>
      <text x="64" y="0" fill="#58A6FF" class="font-mono" font-size="12" font-weight="600">TypeScript • Python • C++ • Go</text>
    </g>

    <!-- Pill 3: Ecosystem -->
    <g transform="translate(510, 0)">
      <text x="0" y="0" fill="#8B949E" class="font-mono" font-size="10">ECOSYSTEM</text>
      <text x="76" y="0" fill="#3FB950" class="font-mono" font-size="12" font-weight="700">Distributed &amp; Next.js</text>
    </g>
  </g>

  <!-- FULL-BODY CARTOON IRON MAN PATROL (WALKING LEFT AND RIGHT IN BOTTOM RIGHT RUNWAY) -->
  <g transform="translate(850, 218)">
    <g class="patrol-group">
      <!-- Upper Body & Head (Bobs during walk) -->
      <g class="body-bob">
        <!-- Helmet (Head) -->
        <rect x="-10" y="-12" width="20" height="18" rx="5" fill="url(#ironRed)" stroke="#7F1D1D" stroke-width="0.8"/>
        <!-- Gold Faceplate -->
        <path d="M -6,-10 L 6,-10 L 7,-3 L 5,4 L -5,4 L -7,-3 Z" fill="url(#ironGold)" stroke="#B45309" stroke-width="0.6"/>
        <!-- Glowing Cyan Eye Slots -->
        <rect x="-4.5" y="-3" width="3" height="1.4" rx="0.7" fill="#38BDF8" filter="url(#arcGlow)"/>
        <rect x="1.5" y="-3" width="3" height="1.4" rx="0.7" fill="#38BDF8" filter="url(#arcGlow)"/>
        <rect x="-4" y="-2.6" width="2" height="0.6" rx="0.3" fill="#FFFFFF"/>
        <rect x="2" y="-2.6" width="2" height="0.6" rx="0.3" fill="#FFFFFF"/>

        <!-- Armor Torso -->
        <path d="M -8,6 L 8,6 L 6,18 L -6,18 Z" fill="url(#ironRed)" stroke="#7F1D1D" stroke-width="0.8"/>
        <!-- Gold Shoulder Pads -->
        <rect x="-11" y="7" width="3.5" height="5" rx="1.5" fill="url(#ironGold)"/>
        <rect x="7.5" y="7" width="3.5" height="5" rx="1.5" fill="url(#ironGold)"/>

        <!-- Glowing Stark Arc Reactor on Chest -->
        <circle cx="0" cy="11" r="2.5" fill="url(#arcCyan)" filter="url(#arcGlow)"/>
        <circle cx="0" cy="11" r="1" fill="#FFFFFF"/>

        <!-- Arms -->
        <path d="M -9,9 L -11,18 L -9,19" stroke="url(#ironRed)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <path d="M 9,9 L 11,18 L 9,19" stroke="url(#ironRed)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <!-- Gold Gauntlet Cuffs -->
        <circle cx="-9.5" cy="18.5" r="1.5" fill="url(#ironGold)"/>
        <circle cx="9.5" cy="18.5" r="1.5" fill="url(#ironGold)"/>
      </g>

      <!-- Animated Walking Legs -->
      <!-- Left Leg -->
      <g class="leg-left">
        <line x1="-3.5" y1="18" x2="-3.5" y2="28" stroke="url(#ironRed)" stroke-width="3" stroke-linecap="round"/>
        <rect x="-5" y="22" width="3" height="3" rx="1" fill="url(#ironGold)"/>
        <!-- Boot -->
        <path d="M -6,28 L -1,28 L -1,30 L -6,30 Z" fill="#7F1D1D"/>
      </g>

      <!-- Right Leg -->
      <g class="leg-right">
        <line x1="3.5" y1="18" x2="3.5" y2="28" stroke="url(#ironRed)" stroke-width="3" stroke-linecap="round"/>
        <rect x="2" y="22" width="3" height="3" rx="1" fill="url(#ironGold)"/>
        <!-- Boot -->
        <path d="M 1,28 L 6,28 L 6,30 L 1,30 Z" fill="#7F1D1D"/>
      </g>
    </g>
  </g>
</svg>
