      <rect x="81" y="0" width="6" height="32" rx="1.5" fill="#39D353"/>
      <rect x="90" y="4" width="6" height="28" rx="1.5" fill="#39D353"/>
      <rect x="99" y="8" width="6" height="24" rx="1.5" fill="#26A641"/>
      <rect x="108" y="14" width="6" height="18" rx="1.5" fill="#0E4429"/>
      <rect x="117" y="4" width="6" height="28" rx="1.5" fill="#26A641"/>
      <rect x="126" y="0" width="6" height="32" rx="1.5" fill="#39D353"/>
      <rect x="135" y="2" width="6" height="30" rx="1.5" fill="#39D353"/>
      <rect x="144" y="8" width="6" height="24" rx="1.5" fill="#26A641"/>
      <rect x="153" y="2" width="6" height="30" rx="1.5" fill="#39D353"/>
      <rect x="162" y="12" width="6" height="20" rx="1.5" fill="#006D32"/>
      <rect x="171" y="0" width="6" height="32" rx="1.5" fill="#39D353"/>
      <rect x="180" y="6" width="6" height="26" rx="1.5" fill="#26A641"/>
      <rect x="189" y="2" width="6" height="30" rx="1.5" fill="#39D353"/>
      <rect x="198" y="10" width="6" height="22" rx="1.5" fill="#006D32"/>
      <rect x="207" y="0" width="6" height="32" rx="1.5" fill="#39D353"/>
      <rect x="216" y="4" width="6" height="28" rx="1.5" fill="#26A641"/>
      <rect x="225" y="0" width="6" height="32" rx="1.5" fill="#39D353"/>
      <rect x="234" y="8" width="6" height="24" rx="1.5" fill="#26A641"/>
      <rect x="243" y="0" width="6" height="32" rx="1.5" fill="#39D353"/>
      <rect x="252" y="4" width="6" height="28" rx="1.5" fill="#39D353"/>
      <rect x="261" y="8" width="6" height="24" rx="1.5" fill="#26A641"/>
      <rect x="270" y="2" width="6" height="30" rx="1.5" fill="#39D353"/>
      <rect x="279" y="6" width="6" height="26" rx="1.5" fill="#26A641"/>
      <rect x="288" y="0" width="6" height="32" rx="1.5" fill="#39D353"/>
      <rect x="297" y="4" width="6" height="28" rx="1.5" fill="#39D353"/>
      <rect x="306" y="10" width="6" height="22" rx="1.5" fill="#26A641"/>
      <rect x="315" y="6" width="6" height="26" rx="1.5" fill="#26A641"/>
      <rect x="324" y="0" width="6" height="32" rx="1.5" fill="#39D353"/>
    </g>
  </g>

  <!-- LOWER METADATA BAR (#161B22) -->
  <line x1="0.5" y1="288" x2="899.5" y2="288" stroke="#30363D" stroke-width="1"/>
  <path d="M 0.5,288 L 899.5,288 L 899.5,333.5 Q 899.5,339.5 893.5,339.5 L 6.5,339.5 Q 0.5,339.5 0.5,333.5 Z" fill="#161B22"/>

  <!-- SYMMETRICALLY CENTERED LOWER METRICS -->
  <g transform="translate(450, 317)">
    <text x="0" y="0" text-anchor="middle" class="font-mono" font-size="11">
      <tspan fill="#8B949E">REPOSITORIES:</tspan> <tspan fill="#F0F6FC" font-weight="700">20+ Shipped Modules</tspan>
      <tspan fill="#484F58"> &#160;•&#160; </tspan>
      <tspan fill="#8B949E">STACK:</tspan> <tspan fill="#58A6FF" font-weight="600">TypeScript • Python • C++ • Go</tspan>
      <tspan fill="#484F58"> &#160;•&#160; </tspan>
      <tspan fill="#8B949E">ECOSYSTEM:</tspan> <tspan fill="#3FB950" font-weight="700">Distributed &amp; Next.js</tspan>
    </text>
