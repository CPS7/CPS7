<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="100%">
  <defs>
    <!-- GitHub Pure Canvas -->
    <linearGradient id="ghCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="40%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#080A0E"/>
    </linearGradient>

    <!-- GitHub Gold Pro Badge -->
    <linearGradient id="proGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2CC60"/>
      <stop offset="100%" stop-color="#D29922"/>
    </linearGradient>

    <!-- GitHub Emerald Gradient -->
    <linearGradient id="ghGreenGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="50%" stop-color="#2EA043"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>

    <linearGradient id="ghBorderHairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363D"/>
      <stop offset="30%" stop-color="#58A6FF" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#3FB950" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#30363D"/>
    </linearGradient>

    <!-- Soft Depth Filter -->
    <filter id="skylineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-gh {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
    }
  </style>

  <!-- GitHub Base Card -->
  <rect x="1" y="1" width="898" height="288" rx="12" fill="url(#ghCanvasBg)" stroke="#30363D" stroke-width="1.2"/>

  <!-- TOP STATUS / GITHUB UNIVERSE VIP BAR -->
  <g transform="translate(36, 28)">
    <!-- GitHub Invertocat Official Vector Silhouette -->
    <path d="M 0,9 C 0,4.03 4.03,0 9,0 C 13.97,0 18,4.03 18,9 C 18,12.98 15.42,16.35 11.84,17.54 C 11.39,17.62 11.23,17.34 11.23,17.11 C 11.23,16.9 11.24,16.34 11.24,15.6 C 8.74,16.14 8.21,14.39 8.21,14.39 C 7.8,13.35 7.21,13.07 7.21,13.07 C 6.39,12.51 7.27,12.52 7.27,12.52 C 8.18,12.58 8.65,13.45 8.65,13.45 C 9.45,14.82 10.75,14.42 11.27,14.19 C 11.35,13.61 11.58,13.21 11.84,12.99 C 9.84,12.76 7.74,11.99 7.74,8.55 C 7.74,7.57 8.09,6.77 8.66,6.14 C 8.57,5.91 8.26,4.99 8.75,3.76 C 8.75,3.76 9.51,3.52 11.23,4.68 C 11.95,4.48 12.72,4.38 13.5,4.38 C 14.28,4.38 15.05,4.48 15.77,4.68 C 17.49,3.52 18.25,3.76 18.25,3.76 C 18.74,4.99 18.43,5.91 18.34,6.14 C 18.91,6.77 19.26,7.57 19.26,8.55 C 19.26,12 17.15,12.76 15.14,12.98 C 15.47,13.26 15.76,13.82 15.76,14.67 C 15.76,15.89 15.75,16.87 15.75,17.11 C 15.75,17.34 15.59,17.63 15.13,17.54 C 11.56,16.35 9,12.98 9,9 Z" fill="#F0F6FC" transform="translate(0, 0) scale(1.1)"/>
    
    <text x="28" y="14" fill="#F0F6FC" class="font-gh" font-size="13" font-weight="700" letter-spacing="0.5">GitHub</text>
    <text x="76" y="14" fill="#8B949E" class="font-gh" font-size="13">/ Special Edition</text>

    <!-- PRO Gold Badge -->
    <g transform="translate(196, 0)">
      <rect x="0" y="0" width="46" height="20" rx="10" fill="#21262D" stroke="url(#proGold)" stroke-width="1.2"/>
      <text x="23" y="14" text-anchor="middle" fill="url(#proGold)" class="font-mono" font-size="10" font-weight="800">PRO</text>
    </g>

    <!-- Right Live Status Tag -->
    <g transform="translate(680, 0)">
      <rect x="0" y="0" width="148" height="20" rx="10" fill="#1C2128" stroke="#30363D"/>
      <circle cx="10" cy="10" r="3.5" fill="#3FB950"/>
      <text x="22" y="14" fill="#C9D1D9" class="font-mono" font-size="9.5" font-weight="600">STATUS: ACTIVE</text>
    </g>
  </g>

  <!-- DIVIDER LINE -->
  <line x1="36" y1="58" x2="864" y2="58" stroke="#30363D" stroke-width="1"/>

  <!-- CENTER IDENTITY AREA -->
  <g transform="translate(36, 78)">
    <!-- GitHub Style Avatar Roundel with CPS7 Monogram -->
    <g>
      <circle cx="45" cy="45" r="45" fill="#21262D" stroke="#30363D" stroke-width="2"/>
      <circle cx="45" cy="45" r="42" fill="#0D1117"/>
      
      <!-- Invertocat Micro Watermark behind text -->
      <path d="M 0,9 C 0,4.03 4.03,0 9,0 C 13.97,0 18,4.03 18,9 C 18,12.98 15.42,16.35 11.84,17.54 C 11.39,17.62 11.23,17.34 11.23,17.11 C 11.23,16.9 11.24,16.34 11.24,15.6 C 8.74,16.14 8.21,14.39 8.21,14.39 C 7.8,13.35 7.21,13.07 7.21,13.07 C 6.39,12.51 7.27,12.52 7.27,12.52 C 8.18,12.58 8.65,13.45 8.65,13.45 C 9.45,14.82 10.75,14.42 11.27,14.19 C 11.35,13.61 11.58,13.21 11.84,12.99 C 9.84,12.76 7.74,11.99 7.74,8.55 C 7.74,7.57 8.09,6.77 8.66,6.14 C 8.57,5.91 8.26,4.99 8.75,3.76 C 8.75,3.76 9.51,3.52 11.23,4.68 C 11.95,4.48 12.72,4.38 13.5,4.38 C 14.28,4.38 15.05,4.48 15.77,4.68 C 17.49,3.52 18.25,3.76 18.25,3.76 C 18.74,4.99 18.43,5.91 18.34,6.14 C 18.91,6.77 19.26,7.57 19.26,8.55 C 19.26,12 17.15,12.76 15.14,12.98 C 15.47,13.26 15.76,13.82 15.76,14.67 C 15.76,15.89 15.75,16.87 15.75,17.11 C 15.75,17.34 15.59,17.63 15.13,17.54 C 11.56,16.35 9,12.98 9,9 Z" fill="#21262D" opacity="0.6" transform="translate(23, 20) scale(2.4)"/>

      <!-- Clean Bold CPS7 Text -->
      <text x="45" y="53" text-anchor="middle" fill="#FFFFFF" class="font-gh" font-size="24" font-weight="900" letter-spacing="1">CPS7</text>

      <!-- Active Status Circle -->
      <g transform="translate(74, 74)">
        <circle cx="0" cy="0" r="9" fill="#0D1117"/>
        <circle cx="0" cy="0" r="6.5" fill="#3FB950"/>
      </g>
    </g>

    <!-- Main Title & Bio Details -->
    <g transform="translate(112, 10)">
      <!-- Name -->
      <text x="0" y="24" fill="#F0F6FC" class="font-gh" font-size="28" font-weight="800" letter-spacing="-0.5">Lakshay Rastogi</text>
      <text x="210" y="24" fill="#58A6FF" class="font-mono" font-size="14" font-weight="600">@CPS7</text>

      <!-- Subtitle -->
      <text x="0" y="48" fill="#8B949E" class="font-gh" font-size="14" font-weight="500">
        Full-Stack Engineer &amp; Systems Builder
      </text>

      <!-- Tagline / Manifesto -->
      <text x="0" y="72" fill="#C9D1D9" class="font-gh" font-size="13">
        "Building software where architecture matters as much as the interface."
      </text>
    </g>

    <!-- RIGHT: GITHUB SKYLINE CONTRIBUTION 3D BARS -->
    <g transform="translate(560, 6)" filter="url(#skylineGlow)">
      <rect x="0" y="0" width="268" height="92" rx="8" fill="#161B22" stroke="#30363D"/>
      
      <text x="14" y="20" fill="#8B949E" class="font-mono" font-size="9" font-weight="600">GITHUB CONTRIBUTION SKYLINE</text>
      <text x="14" y="36" fill="#58A6FF" class="font-mono" font-size="12" font-weight="700">52-Week Velocity Matrix</text>

      <!-- 3D Skyline Wave Bars -->
      <g transform="translate(14, 48)">
        <rect x="0" y="16" width="6" height="20" rx="1.5" fill="#0E4429"/>
        <rect x="9" y="10" width="6" height="26" rx="1.5" fill="#006D32"/>
        <rect x="18" y="4" width="6" height="32" rx="1.5" fill="#26A641"/>
        <rect x="27" y="0" width="6" height="36" rx="1.5" fill="#39D353"/>
        <rect x="36" y="8" width="6" height="28" rx="1.5" fill="#26A641"/>
        <rect x="45" y="14" width="6" height="22" rx="1.5" fill="#006D32"/>
        <rect x="54" y="2" width="6" height="34" rx="1.5" fill="#39D353"/>
        <rect x="63" y="6" width="6" height="30" rx="1.5" fill="#26A641"/>
        <rect x="72" y="12" width="6" height="24" rx="1.5" fill="#006D32"/>
        <rect x="81" y="0" width="6" height="36" rx="1.5" fill="#39D353"/>
        <rect x="90" y="4" width="6" height="32" rx="1.5" fill="#39D353"/>
        <rect x="99" y="8" width="6" height="28" rx="1.5" fill="#26A641"/>
        <rect x="108" y="16" width="6" height="20" rx="1.5" fill="#0E4429"/>
        <rect x="117" y="6" width="6" height="30" rx="1.5" fill="#26A641"/>
        <rect x="126" y="0" width="6" height="36" rx="1.5" fill="#39D353"/>
        <rect x="135" y="2" width="6" height="34" rx="1.5" fill="#39D353"/>
        <rect x="144" y="10" width="6" height="26" rx="1.5" fill="#26A641"/>
        <rect x="153" y="4" width="6" height="32" rx="1.5" fill="#39D353"/>
        <rect x="162" y="14" width="6" height="22" rx="1.5" fill="#006D32"/>
        <rect x="171" y="0" width="6" height="36" rx="1.5" fill="#39D353"/>
        <rect x="180" y="8" width="6" height="28" rx="1.5" fill="#26A641"/>
        <rect x="189" y="4" width="6" height="32" rx="1.5" fill="#39D353"/>
        <rect x="198" y="12" width="6" height="24" rx="1.5" fill="#006D32"/>
        <rect x="207" y="0" width="6" height="36" rx="1.5" fill="#39D353"/>
        <rect x="216" y="6" width="6" height="30" rx="1.5" fill="#26A641"/>
        <rect x="225" y="0" width="6" height="36" rx="1.5" fill="#39D353"/>
        <rect x="234" y="10" width="6" height="26" rx="1.5" fill="#26A641"/>
      </g>
    </g>
  </g>

  <!-- LOWER METADATA TELEMETRY BAR -->
  <line x1="36" y1="205" x2="864" y2="205" stroke="#30363D" stroke-width="1"/>

  <g transform="translate(36, 238)">
    <!-- Pill 1: Repos -->
    <g>
      <text x="0" y="0" fill="#8B949E" class="font-mono" font-size="10">REPOSITORIES</text>
      <text x="90" y="0" fill="#F0F6FC" class="font-gh" font-size="13" font-weight="700">20+ Shipped Modules</text>
    </g>

    <!-- Pill 2: Stack -->
    <g transform="translate(320, 0)">
      <text x="0" y="0" fill="#8B949E" class="font-mono" font-size="10">RUNTIME</text>
      <text x="64" y="0" fill="#58A6FF" class="font-mono" font-size="12" font-weight="600">TypeScript • Python • C++ • Go</text>
    </g>

    <!-- Pill 3: Ecosystem -->
    <g transform="translate(640, 0)">
      <text x="0" y="0" fill="#8B949E" class="font-mono" font-size="10">ECOSYSTEM</text>
      <text x="76" y="0" fill="#3FB950" class="font-mono" font-size="12" font-weight="700">Distributed &amp; Next.js</text>
    </g>
  </g>
</svg>
