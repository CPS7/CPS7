<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
    }
    .font-mono {
      font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
    }
    .pill {
      transition: all 0.3s ease;
    }
  </style>

  <!-- Row 1: Languages & Core -->
  <g transform="translate(0, 0)">
    <text x="0" y="20" fill="#64748B" class="font-mono" font-size="10" font-weight="600" letter-spacing="1.5">CORE LANGUAGES</text>
    
    <!-- TypeScript -->
    <g transform="translate(140, 4)">
      <rect class="pill" x="0" y="0" width="105" height="26" rx="6" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#3178C6"/>
      <text x="24" y="17" fill="#E2E8F0" class="font-sans" font-size="11" font-weight="500">TypeScript</text>
    </g>

    <!-- Python -->
    <g transform="translate(255, 4)">
      <rect class="pill" x="0" y="0" width="85" height="26" rx="6" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#3776AB"/>
      <text x="24" y="17" fill="#E2E8F0" class="font-sans" font-size="11" font-weight="500">Python</text>
    </g>

    <!-- Rust -->
    <g transform="translate(350, 4)">
      <rect class="pill" x="0" y="0" width="75" height="26" rx="6" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#DEA584"/>
      <text x="24" y="17" fill="#E2E8F0" class="font-sans" font-size="11" font-weight="500">Rust</text>
    </g>

    <!-- Go -->
    <g transform="translate(435, 4)">
      <rect class="pill" x="0" y="0" width="65" height="26" rx="6" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#00ADD8"/>
      <text x="24" y="17" fill="#E2E8F0" class="font-sans" font-size="11" font-weight="500">Go</text>
    </g>

    <!-- SQL -->
    <g transform="translate(510, 4)">
      <rect class="pill" x="0" y="0" width="70" height="26" rx="6" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#E5BE64"/>
      <text x="24" y="17" fill="#E2E8F0" class="font-sans" font-size="11" font-weight="500">SQL</text>
    </g>

    <!-- C++ -->
    <g transform="translate(590, 4)">
      <rect class="pill" x="0" y="0" width="70" height="26" rx="6" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#00599C"/>
      <text x="24" y="17" fill="#E2E8F0" class="font-sans" font-size="11" font-weight="500">C++</text>
    </g>
  </g>

  <!-- Row 2: Frameworks & Web Platforms -->
  <g transform="translate(0, 48)">
    <text x="0" y="20" fill="#64748B" class="font-mono" font-size="10" font-weight="600" letter-spacing="1.5">FULL-STACK &amp; WEB</text>
    
    <!-- Next.js 15 -->
    <g transform="translate(140, 4)">
      <rect class="pill" x="0" y="0" width="95" height="26" rx="6" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#FFFFFF"/>
      <text x="24" y="17" fill="#E2E8F0" class="font-sans" font-size="11" font-weight="500">Next.js 15</text>
    </g>

    <!-- React 19 -->
    <g transform="translate(245, 4)">
      <rect class="pill" x="0" y="0" width="90" height="26" rx="6" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#61DAFB"/>
      <text x="24" y="17" fill="#E2E8F0" class="font-sans" font-size="11" font-weight="500">React 19</text>
    </g>

    <!-- Node.js -->
    <g transform="translate(345, 4)">
      <rect class="pill" x="0" y="0" width="85" height="26" rx="6" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#5FA04E"/>
      <text x="24" y="17" fill="#E2E8F0" class="font-sans" font-size="11" font-weight="500">Node.js</text>
    </g>

    <!-- GraphQL -->
    <g transform="translate(440, 4)">
      <rect class="pill" x="0" y="0" width="90" height="26" rx="6" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#E10098"/>
      <text x="24" y="17" fill="#E2E8F0" class="font-sans" font-size="11" font-weight="500">GraphQL</text>
    </g>

    <!-- Tailwind / Vanilla -->
    <g transform="translate(540, 4)">
      <rect class="pill" x="0" y="0" width="115" height="26" rx="6" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#38BDF8"/>
      <text x="24" y="17" fill="#E2E8F0" class="font-sans" font-size="11" font-weight="500">Modern CSS</text>
    </g>
  </g>

  <!-- Row 3: Data & Cloud Systems -->
  <g transform="translate(0, 96)">
    <text x="0" y="20" fill="#64748B" class="font-mono" font-size="10" font-weight="600" letter-spacing="1.5">DATA &amp; CLOUD</text>
    
    <!-- PostgreSQL -->
    <g transform="translate(140, 4)">
      <rect class="pill" x="0" y="0" width="105" height="26" rx="6" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#4169E1"/>
      <text x="24" y="17" fill="#E2E8F0" class="font-sans" font-size="11" font-weight="500">PostgreSQL</text>
    </g>

    <!-- Redis -->
    <g transform="translate(255, 4)">
      <rect class="pill" x="0" y="0" width="80" height="26" rx="6" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#DC382D"/>
      <text x="24" y="17" fill="#E2E8F0" class="font-sans" font-size="11" font-weight="500">Redis</text>
    </g>

    <!-- Docker -->
    <g transform="translate(345, 4)">
      <rect class="pill" x="0" y="0" width="85" height="26" rx="6" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#2496ED"/>
      <text x="24" y="17" fill="#E2E8F0" class="font-sans" font-size="11" font-weight="500">Docker</text>
    </g>

    <!-- AWS / Cloudflare -->
    <g transform="translate(440, 4)">
      <rect class="pill" x="0" y="0" width="105" height="26" rx="6" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#F38020"/>
      <text x="24" y="17" fill="#E2E8F0" class="font-sans" font-size="11" font-weight="500">Cloudflare</text>
    </g>

    <!-- Kubernetes -->
    <g transform="translate(555, 4)">
      <rect class="pill" x="0" y="0" width="105" height="26" rx="6" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#326CE5"/>
      <text x="24" y="17" fill="#E2E8F0" class="font-sans" font-size="11" font-weight="500">Kubernetes</text>
    </g>
  </g>
</svg>
